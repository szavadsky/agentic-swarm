<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#1f6feb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#2ea043"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#f85149"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="880" fill="#0d1117"/>

  <!-- Title -->
  <text x="700" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#e6edf3">Cost- &amp; Quality-Optimized Multi-Agent Development Loop</text>
  <text x="700" y="72" text-anchor="middle" font-size="13" fill="#8b949e">One generic loop · machine-enforced guardrails · a consult-and-replan failure path</text>

  <!-- ===== Left column: numbered loop ===== -->
  <!-- 1 Goal -->
  <rect x="100" y="100" width="590" height="60" rx="10" fill="#0d2135" stroke="#1f6feb" stroke-width="1.5"/>
  <circle cx="128" cy="130" r="13" fill="#1f6feb"/>
  <text x="128" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="152" y="125" font-size="18" font-weight="700" fill="#79c0ff">Goal</text>
  <text x="152" y="145" font-size="12.5" fill="#8b949e">objective, scope, success criteria</text>

  <line x1="395" y1="160" x2="395" y2="180" stroke="#1f6feb" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 2 Planner -->
  <rect x="100" y="184" width="590" height="64" rx="10" fill="#0d2135" stroke="#1f6feb" stroke-width="1.5"/>
  <circle cx="128" cy="216" r="13" fill="#1f6feb"/>
  <text x="128" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="152" y="211" font-size="18" font-weight="700" fill="#79c0ff">Planner</text>
  <text x="152" y="231" font-size="12.5" fill="#8b949e">high-reasoner · investigation swarm · consultants</text>

  <line x1="395" y1="248" x2="395" y2="268" stroke="#1f6feb" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 3 Plan -->
  <rect x="100" y="272" width="590" height="64" rx="10" fill="#0d2135" stroke="#1f6feb" stroke-width="1.5"/>
  <circle cx="128" cy="304" r="13" fill="#1f6feb"/>
  <text x="128" y="309" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="152" y="299" font-size="18" font-weight="700" fill="#79c0ff">Plan</text>
  <text x="152" y="319" font-size="12.5" fill="#8b949e">milestones → task DAG · small, reviewable tasks</text>

  <line x1="395" y1="336" x2="395" y2="356" stroke="#1f6feb" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 4 Orchestrator -->
  <rect x="100" y="360" width="590" height="64" rx="10" fill="#0d2135" stroke="#1f6feb" stroke-width="1.5"/>
  <circle cx="128" cy="392" r="13" fill="#1f6feb"/>
  <text x="128" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="152" y="387" font-size="18" font-weight="700" fill="#79c0ff">Orchestrator</text>
  <text x="152" y="407" font-size="12.5" fill="#8b949e">task specs as pointers · waves ≤ 5 · read-only</text>

  <line x1="395" y1="424" x2="395" y2="444" stroke="#1f6feb" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 5 Parallel dev wave -->
  <rect x="100" y="448" width="590" height="140" rx="10" fill="#0d2135" stroke="#1f6feb" stroke-width="1.5"/>
  <circle cx="128" cy="473" r="13" fill="#1f6feb"/>
  <text x="128" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="152" y="478" font-size="18" font-weight="700" fill="#79c0ff">Parallel dev wave</text>
  <text x="152" y="497" font-size="12.5" fill="#8b949e">isolated worktrees · one implement / check pair per task</text>

  <rect x="130" y="510" width="210" height="44" rx="8" fill="#0d2135" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="235" y="537" text-anchor="middle" font-size="15" font-weight="600" fill="#79c0ff">Implementer</text>
  <line x1="346" y1="532" x2="462" y2="532" stroke="#2ea043" stroke-width="2" marker-end="url(#ag)"/>
  <text x="404" y="522" text-anchor="middle" font-size="11" fill="#8b949e">evidence-gated</text>
  <rect x="470" y="510" width="202" height="44" rx="8" fill="#12261a" stroke="#2ea043" stroke-width="1.2"/>
  <text x="571" y="537" text-anchor="middle" font-size="15" font-weight="600" fill="#56d364">Checker-Committer</text>

  <line x1="395" y1="588" x2="395" y2="608" stroke="#1f6feb" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 6 Checkpoint -->
  <rect x="100" y="612" width="590" height="64" rx="10" fill="#12261a" stroke="#2ea043" stroke-width="1.5"/>
  <circle cx="128" cy="644" r="13" fill="#2ea043"/>
  <text x="128" y="649" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <text x="152" y="639" font-size="18" font-weight="700" fill="#56d364">Checkpoint</text>
  <text x="152" y="659" font-size="12.5" fill="#8b949e">quality gates pass · grouped, reviewable commits</text>

  <!-- Loop-back: checkpoint -> orchestrator (next wave) -->
  <path d="M690,644 H726 V392 H690" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ab)"/>
  <text x="718" y="518" text-anchor="middle" font-size="11" fill="#58a6ff" transform="rotate(-90 718 518)">next wave</text>

  <!-- Failure path: checkpoint -> consult &amp; amend -->
  <line x1="395" y1="676" x2="395" y2="700" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="405" y="693" font-size="11" fill="#ff7b72">gates fail</text>
  <rect x="245" y="704" width="300" height="58" rx="10" fill="#2d1418" stroke="#f85149" stroke-width="1.5"/>
  <text x="395" y="727" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">Consult &amp; amend plan</text>
  <text x="395" y="748" text-anchor="middle" font-size="11.5" fill="#8b949e">investigators · revise goals or plan</text>

  <!-- Loop-back: consult -> planner -->
  <path d="M245,733 H64 V216 H96" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="56" y="475" text-anchor="middle" font-size="11" fill="#ff7b72" transform="rotate(-90 56 475)">amended plan</text>

  <!-- ===== Right column: constitution &amp; guardrails ===== -->
  <text x="1070" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#d2a8ff">Constitution &amp; Guardrails</text>

  <!-- A Constitution file(s) -->
  <rect x="790" y="142" width="560" height="72" rx="10" fill="#221a38" stroke="#8957e5" stroke-width="1.5"/>
  <text x="1070" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="#d2a8ff">Constitution file(s)</text>
  <text x="1070" y="193" text-anchor="middle" font-size="12.5" fill="#8b949e">pre-agreed, machine-checkable rules</text>

  <line x1="1070" y1="218" x2="1070" y2="236" stroke="#2ea043" stroke-width="2" marker-end="url(#ag)"/>

  <!-- B Redundant checker battery -->
  <rect x="790" y="242" width="560" height="72" rx="10" fill="#12261a" stroke="#2ea043" stroke-width="1.5"/>
  <text x="1070" y="271" text-anchor="middle" font-size="18" font-weight="700" fill="#56d364">Redundant checker battery</text>
  <text x="1070" y="293" text-anchor="middle" font-size="12.5" fill="#8b949e">multiple independent verifiers re-check each change</text>

  <line x1="1070" y1="318" x2="1070" y2="336" stroke="#2ea043" stroke-width="2" marker-end="url(#ag)"/>

  <!-- C Violation ratchet -->
  <rect x="790" y="342" width="560" height="72" rx="10" fill="#12261a" stroke="#2ea043" stroke-width="1.5"/>
  <text x="1070" y="371" text-anchor="middle" font-size="18" font-weight="700" fill="#56d364">Violation ratchet &amp; baseline</text>
  <text x="1070" y="393" text-anchor="middle" font-size="12.5" fill="#8b949e">quality metrics may only tighten over time</text>

  <line x1="1070" y1="418" x2="1070" y2="436" stroke="#2ea043" stroke-width="2" marker-end="url(#ag)"/>

  <!-- D Suppression justification gate -->
  <rect x="790" y="442" width="560" height="72" rx="10" fill="#12261a" stroke="#2ea043" stroke-width="1.5"/>
  <text x="1070" y="471" text-anchor="middle" font-size="18" font-weight="700" fill="#56d364">Suppression justification gate</text>
  <text x="1070" y="493" text-anchor="middle" font-size="12.5" fill="#8b949e">every waiver needs a written, reviewed reason</text>

  <line x1="1070" y1="518" x2="1070" y2="536" stroke="#2ea043" stroke-width="2" marker-end="url(#ag)"/>

  <!-- E Autofix + parse canary -->
  <rect x="790" y="542" width="560" height="72" rx="10" fill="#12261a" stroke="#2ea043" stroke-width="1.5"/>
  <text x="1070" y="571" text-anchor="middle" font-size="18" font-weight="700" fill="#56d364">Autofix + parse canary</text>
  <text x="1070" y="593" text-anchor="middle" font-size="12.5" fill="#8b949e">auto-patches must re-parse cleanly</text>

  <line x1="1070" y1="618" x2="1070" y2="636" stroke="#2ea043" stroke-width="2" marker-end="url(#ag)"/>

  <!-- F End-to-end gate -->
  <rect x="790" y="642" width="560" height="72" rx="10" fill="#12261a" stroke="#2ea043" stroke-width="1.5"/>
  <text x="1070" y="671" text-anchor="middle" font-size="18" font-weight="700" fill="#56d364">End-to-end gate</text>
  <text x="1070" y="693" text-anchor="middle" font-size="12.5" fill="#8b949e">proves the enforcement toolchain itself fires</text>
  <!-- Guardrails wired into checkpoint -->
  <path d="M790,678 H748 V648 H694" fill="none" stroke="#2ea043" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ag)"/>
  <text x="740" y="706" text-anchor="middle" font-size="11" fill="#56d364">enforced at step 6</text>

  <!-- ===== Footnote band ===== -->
  <rect x="40" y="792" width="1320" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="700" y="822" text-anchor="middle" font-size="15"><tspan font-weight="700" fill="#e6edf3">Worked example: python-setup</tspan><tspan dx="7" fill="#8b949e">— 428 commits · 2026-06-13 → 2026-07-22 · v1.2.9 · 13 lint tools · ~1290 tests</tspan></text>
</svg>