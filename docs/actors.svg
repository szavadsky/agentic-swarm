<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="13">
  <title id="t">Key actors of the agentic software factory</title>
  <desc id="d">The kernel launches the architect, PM, plan checker, steward and task flows through the harness layer.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="640" fill="#fff"/>

  <rect x="20" y="20" width="860" height="60" rx="8" fill="#e8eef9" stroke="#3b5ba5"/>
  <text x="450" y="45" text-anchor="middle" font-weight="bold" font-size="16">KERNEL (deterministic script)</text>
  <text x="450" y="65" text-anchor="middle">launches agents · reads artifacts · steers · git and worktrees · gates · merges</text>

  <rect x="20" y="120" width="190" height="80" rx="8" fill="#fdf0d5" stroke="#b07a10"/>
  <text x="115" y="150" text-anchor="middle" font-weight="bold">Architect</text>
  <text x="115" y="170" text-anchor="middle">directional plan,</text>
  <text x="115" y="187" text-anchor="middle">once per iteration</text>

  <rect x="255" y="120" width="190" height="80" rx="8" fill="#e6f4e6" stroke="#3a7d3a"/>
  <text x="350" y="150" text-anchor="middle" font-weight="bold">PM</text>
  <text x="350" y="170" text-anchor="middle">plan → task DAG,</text>
  <text x="350" y="187" text-anchor="middle">triages steers</text>

  <rect x="490" y="120" width="190" height="80" rx="8" fill="#f3e6f7" stroke="#8a3fa3"/>
  <text x="585" y="150" text-anchor="middle" font-weight="bold">Plan checker</text>
  <text x="585" y="170" text-anchor="middle">completeness; extra tasks</text>
  <text x="585" y="187" text-anchor="middle">or back to architect</text>

  <rect x="715" y="120" width="165" height="80" rx="8" fill="#fbe4e4" stroke="#b03a3a"/>
  <text x="797" y="150" text-anchor="middle" font-weight="bold">Steward</text>
  <text x="797" y="170" text-anchor="middle">merge conflicts,</text>
  <text x="797" y="187" text-anchor="middle">red goal branch</text>

  <rect x="20" y="260" width="860" height="170" rx="8" fill="#f6f6f6" stroke="#777"/>
  <text x="450" y="283" text-anchor="middle" font-weight="bold">Task flows (DAG of tasks, one git worktree each)</text>
  <g stroke="#555" fill="#fff">
    <rect x="50" y="310" width="140" height="50" rx="6"/>
    <rect x="260" y="310" width="140" height="50" rx="6"/>
    <rect x="470" y="310" width="140" height="50" rx="6"/>
    <rect x="680" y="310" width="140" height="50" rx="6"/>
  </g>
  <g text-anchor="middle" stroke="none" fill="#222">
    <text x="120" y="340">Implement</text>
    <text x="330" y="340">QA</text>
    <text x="540" y="340">Review</text>
    <text x="750" y="340">Merge</text>
  </g>
  <g stroke="#444" fill="none" marker-end="url(#a)">
    <line x1="190" y1="335" x2="258" y2="335"/>
    <line x1="400" y1="335" x2="468" y2="335"/>
    <line x1="610" y1="335" x2="678" y2="335"/>
  </g>
  <text x="450" y="395" text-anchor="middle">concerns flow up: implementer → reviewer → PM / plan checker → architect → human</text>
  <text x="450" y="415" text-anchor="middle">trivial goals and standalone tasks skip the architect; an upscope verdict escalates to it</text>

  <rect x="20" y="480" width="860" height="140" rx="8" fill="#eef7f7" stroke="#2f7f86"/>
  <text x="450" y="505" text-anchor="middle" font-weight="bold">Harness layer (agents run here, any subscription or model)</text>
  <g stroke="#2f7f86" fill="#fff">
    <rect x="50" y="530" width="150" height="60" rx="6"/>
    <rect x="225" y="530" width="150" height="60" rx="6"/>
    <rect x="400" y="530" width="150" height="60" rx="6"/>
    <rect x="575" y="530" width="150" height="60" rx="6"/>
    <rect x="750" y="530" width="100" height="60" rx="6"/>
  </g>
  <g text-anchor="middle" stroke="none" fill="#222">
    <text x="125" y="565">omp</text>
    <text x="300" y="565">Claude Code</text>
    <text x="475" y="565">OpenCode / pi / codex</text>
    <text x="650" y="565">ACP via acpx</text>
    <text x="800" y="565">fallbacks</text>
  </g>

  <g stroke="#444" fill="none" marker-end="url(#a)">
    <line x1="115" y1="80" x2="115" y2="118"/>
    <line x1="350" y1="80" x2="350" y2="118"/>
    <line x1="585" y1="80" x2="585" y2="118"/>
    <line x1="797" y1="80" x2="797" y2="118"/>
    <line x1="450" y1="80" x2="450" y2="258" stroke-dasharray="4 3"/>
    <line x1="450" y1="430" x2="450" y2="478" marker-start="url(#a)"/>
  </g>
</svg>
