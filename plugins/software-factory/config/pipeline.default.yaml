# software-factory v2 — Default Pipeline Configuration
#
# This file defines the default pipeline configuration.
# Configuration is layered in order of precedence:
#   1. config/pipeline.default.yaml (this file)
#   2. <repo>/.factory/pipeline.yaml (project-wide pipeline overrides)
#   3. <repo>/{orchestrationFolder}/{task}/pipeline.yaml (task-specific pipeline overrides)
#
# Merging semantics across layers:
#   - Maps (objects) are deeply merged, EXCEPT models.roles.<name> defs which
#     replace atomically per layer (a {alias} override drops model+fallbacks).
#   - Arrays are replaced (not concatenated).
#   - Explicit `null` values delete the corresponding key from the merged map.
#   - Task layer is read from the task worktree after the first run; preflight
#     validates that effective pipeline.
#
# Layer-override example (<repo>/.factory/pipeline.yaml):
#   limits:
#     maxParallelItems: 8        # deep-merged scalar override
#     checkOutputBytes: null     # `null` deletes the key from the merged map
#   models:
#     roles:
#       architect: { alias: alt-architect }   # atomic role replacement
#   agents:
#     docs-writer:               # new map keys are added
#       role: workhorse
#       timeoutSec: 600

# ==============================================================================
# Models & Roles (§5, §12.4)
# ==============================================================================
# Defines model roles, aliases, and fallback chains.
# Each role is either:
#   - Direct model with optional fallbacks: { model: "...", fallbacks: ["..."] }
#   - Alias pointing to another role: { alias: "..." }
#
# Fallback resolution expands recursively and deduplicates while preserving primary first.
# Cycles in alias chains are detected and rejected at preflight.
# Role defs replace atomically per layer: overriding one key drops the rest.
models:
  roles:
    # Primary workhorse for development, triage, infra, fact-finding
    workhorse:
      model: opencode-go/deepseek-v4.1-flash
      fallbacks: [alt-workhorse]

    # Alternative workhorse used for review, PM, and rotation on retries
    alt-workhorse:
      model: opencode-go/muse-spark-1.3-contributor
      fallbacks: [workhorse]

    # Reviewing roles aliased to alt-workhorse (split producer/reviewer within class)
    task-reviewer:
      alias: alt-workhorse

    wave-close-up:
      alias: workhorse

    plan-close-up:
      alias: alt-workhorse

    # High-reasoning escalation model for difficult tasks / escalatable steps
    task-escalation:
      model: anthropic/claude-sonnet-5-5:max

    # Ultra-cheap model for structural repair and steering classification
    simpler:
      model: google-antigravity/gemini-3.8-flash
      fallbacks: [workhorse]

    # Project manager role for plan edits
    pm:
      alias: alt-workhorse

    # Architect role for high-level decomposition, milestones, consults.
    # Overridable per task (fire tests alias it to a cheap role).
    architect:
      model: anthropic/claude-opus-5-5:max
      fallbacks: [alt-architect]

    alt-architect:
      model: opencode-go/muse-spark-1.3-contributor

# ==============================================================================
# Agents (§5, §10)
# ==============================================================================
# Maps agent names to their default role and per-agent timeout.
# Tools come from the agent definition frontmatter (agents/*.md), not this file.
# Built-in agents: triage, infra, architect, plan-reviewer, pm, developer,
#                  qa, reviewer, fact-finder, wave-close-up, plan-close-up.
#
# Per-agent timeouts: `timeoutSec` caps a single agent turn. Step-level
# `timeoutSec` (in flows) overrides the agent default; when neither is set the
# harness default applies (2700s). Timeouts measure active (monotonic) time, so
# machine sleep never burns the budget. Tiers: poc/architect 2h (7200s),
# tdd/dev/qa 90m (5400s), fact-finder/review 1h (3600s), quick scoping/summary
# agents 45m (2700s). Nothing is set below 45m — short timeouts kill productive
# turns and cost more in retries than they save.
#
# Extra agents can be added here with:
#   my-agent:
#     role: workhorse
#     timeoutSec: 900
#     definition: .factory/agents/my-agent.md   # Path to definition or inline
#     output: developer | review | path/to/schema.json
agents:
  triage:
    role: workhorse
    timeoutSec: 2700
  infra:
    role: workhorse
    timeoutSec: 2700
  architect:
    role: architect
    timeoutSec: 7200
  plan-reviewer:
    role: alt-architect
    timeoutSec: 3600
  pm:
    role: pm
    timeoutSec: 2700
    tools: [] # yield-only: PM structures architect outlines from injected prompt vars, no file tools (frontmatter says the same; config wins if they drift)
  developer:
    role: workhorse
    timeoutSec: 5400
  qa:
    role: task-reviewer
    timeoutSec: 5400
  reviewer:
    role: task-reviewer
    timeoutSec: 3600
  fact-finder:
    role: workhorse
    timeoutSec: 3600
  wave-close-up:
    role: wave-close-up
    timeoutSec: 2700
  plan-close-up:
    role: plan-close-up
    timeoutSec: 2700

# ==============================================================================
# Custom Checks (§5, §9)
# ==============================================================================
# Custom mechanical checks executed by the engine.
# Built-in checks (schema, citations, plan-limits, gates, tests-only, test-first-scope,
# target-red, target-green, red-test, test-diff, size, poc-scope) do not
# need declarations here. schema/citations/plan-limits are engine-internal and
# cannot be attached to steps or hooks.
#
# Built-in "gates" ratchet:
# - Gates green in gates-baseline.yaml must remain green.
# - For test runner gates with junitArg: evaluated per-test. Fails iff any failing or
#   erroring test ID (or collection error) was not present in the baseline. Newly
#   passing baseline failures are reported as improvements. Old-format red baselines
#   lacking per-test ids are backfilled by re-running the gate at the baseline commit.
# - Gates without junitArg stay green-only ratchet (pre-existing baseline failures do
#   not fail the whole gate run).
# - Any gate/check that dirties the worktree is restored, flagged
#   `mutatesWorktree`, fails, and journals `worktree_mutation_detected`.
#
# To define a custom check:
# checks:
#   mutation:
#     run: "uv run mutmut run --paths-to-mutate {{changedProd}}"
#     expect: pass                    # pass | fail
#     cwd: item                       # item | task
#     timeoutSec: 900
#     phase: after                    # before | after
#     onFail: fix-loop                # retry-step | fix-loop | consult | feed (declared; not dispatched per mode today)
# Placeholders: {{worktree}} {{wt}} {{base}} {{head}} {{task}} {{item}} {{changedProd}} {{changedTests}}.
checks: {}

# ==============================================================================
# Hooks (§5, §8.10)
# ==============================================================================
# Injects extra agents or checks before/after any valid lifecycle seam.
# Valid seams:
#   ingest.triage, ingest.infra, plan.architect, plan.review, plan.edits,
#   item.start, item.step.{id}, item.accept, item.merge,
#   wave.start, wave.merge, wave.closeup,
#   iteration.start, iteration.closeup, task.done.
# Wired today: before/after item.step.{id}, after item.merge, after task.done.
# Hook checks run; hook agents are only journaled, and hook results do not fail
# the seam. Synthetic-item creation for code-writing hook agents is not
# implemented; preflight only rejects the self-triggering combo.
#
# Example:
# hooks:
#   after:item.step.develop:
#     - check: mutation
#       when: { kinds: [dev] }
#   after:wave.merge:
#     - agent: docs-writer
hooks: {}

# ==============================================================================
# Flows (§5, §8.1, §8.2, §8.3)
# ==============================================================================
# Defines step sequences, checks, and retry targets per task/item kind.
#
# Step fields:
#   - id: step identifier (e.g. develop, qa, review)
#   - agent: agent name defined in `agents`
#   - role: optional role override
#   - retryRole: role to swap to on retry (fix round >= 2); rotated developer rounds use a fresh session
#   - escalatable: if true, uses `task-escalation` when item is escalated
#   - session: fresh | reuse (default reuse; reuse resumes the kept session, falling back to the recorded interrupted session)
#   - checks: array of check IDs to execute at this step (red-test/test-diff/phase-before run before the agent; the rest after; any failure records `rejected`)
#   - focus: domain focus for reviewer prompt (e.g. code, security, result)
#   - stepFragment: optional fragment name in agents/steps/{fragment}.md (defaults to step id).
#     Use it whenever the step id is generic but the prompt must be kind-specific
#     (e.g. spike `develop` steps render `poc` / `test-assumptions`, not `develop`).
#   - timeoutSec: per-step deadline (overrides the agent default)
#
# Adding a story/spike kind end to end (worked example: `docs-only` story kind):
#   1. flows entry: add `story.docs-only` (or `spike.<kind>`) with `criteria`
#      (one line; shown to PM in the kinds guide), `steps`, and `fixLoopTo`
#      naming one of the kind's own step ids (preflight rejects dangling refs).
#   2. criteria text: extend `agents/criteria/story-kinds.md` with the kind's
#      contract so PM/reviewers apply the right rules.
#   3. stepFragment: if a step needs a kind-specific prompt, add
#      `agents/steps/<fragment>.md` and set `stepFragment` on the step.
#      Otherwise the step renders `agents/steps/<id>.md`.
#   4. per-kind limits: optional `limits:` map on the kind (schema-accepted but
#      not read by the engine today; global `limits` apply).
#   Example:
#   story:
#     docs-only:
#       criteria: "documentation updates without code change"
#       limits: { storyMaxProdLines: 50 }
#       steps:
#         - id: develop
#           agent: developer
#           stepFragment: docs-develop
#           checks: [gates]
#         - id: review
#           agent: reviewer
#           focus: code
#       fixLoopTo: develop
flows:
  # Simple pre-checks for triage-simple work (gates + advisory size). Over
  # simpleMaxProdLines (or red gates) converts to a `no-behavior` item on the
  # renamed scratch branch; under budget with green gates merges.
  simple:
    steps:
      - id: develop
        agent: developer
        stepFragment: simple-implement
        checks: [gates, size]

  # Story kinds (configurable):
  story:
    dev:
      criteria: "behavior change; tests first"
      steps:
        - id: test-first
          agent: developer
          checks: [test-first-scope, target-red]
        - id: develop
          agent: developer
          escalatable: true
          session: reuse
          retryRole: alt-workhorse
          checks: [gates, target-green, size]
        - id: qa
          agent: qa
          checks: [red-test, test-diff]
        - id: review
          agent: reviewer
          focus: code
          escalatable: true
      fixLoopTo: develop

    no-behavior:
      criteria: "refactoring, file move, dependency update without prod behavior change"
      steps:
        - id: develop
          agent: developer
          checks: [gates, size]
        - id: qa
          agent: qa
          checks: [test-diff]
        - id: review
          agent: reviewer
          focus: code
      fixLoopTo: develop

    test-only:
      criteria: "test additions or improvements without prod code change"
      steps:
        - id: develop
          agent: developer
          checks: [gates, tests-only]
        - id: review
          agent: reviewer
          focus: code
      fixLoopTo: develop

  # Spike kinds (configurable):
  spike:
    fact-finder:
      criteria: "investigate library, API, or unknown without writing production code"
      steps:
        - id: research
          agent: fact-finder
        - id: review
          agent: reviewer
          focus: result
      fixLoopTo: research

    poc:
      criteria: "throwaway proof of concept confined to poc/ folder"
      steps:
        - id: develop
          agent: developer
          stepFragment: poc
          checks: [poc-scope]
        - id: review
          agent: reviewer
          focus: result
      fixLoopTo: develop

    test-assumptions:
      criteria: "exploratory tests demonstrating how lower level works that stay"
      steps:
        - id: develop
          agent: developer
          stepFragment: test-assumptions
          checks: [gates, tests-only]
        - id: review
          agent: reviewer
          focus: result
      fixLoopTo: develop

# ==============================================================================
# Limits (§5, §12.2)
# ==============================================================================
# Hard thresholds for loops, parallelism, size budgets, and output caps.
# Note: src/core/loops.ts DEFAULT_LIMITS differ (they are fallback defaults for
# direct helper use, not the effective pipeline — this file wins).
limits:
  maxParallelItems: 4             # Concurrently executing items per task wave
  maxParallelTurns: 6             # Concurrent harness turns across the whole run
  stubMaxProdLines: 40            # Max added prod lines in NEW stub files during test-first (modified prod files always fail)
  maxStepAttempts: 2              # Attempts per step before consult
  maxInterruptions: 3             # Interrupted/started reuses the same attempt number until this cap, then +1
  maxFixRounds: 3                 # Iterative fix rounds before consult
  maxConsultsPerItem: 2           # Architect consults per item before fail
  maxSplitDepth: 1                # Declared only; split-depth is not enforced today
  maxPlanReviewRounds: 2          # Architect <-> plan-reviewer rounds
  maxAmendmentsPerIteration: 3    # Mid-iteration plan amendments (past the cap, amendments are skipped)
  maxIterations: 6                # Max iterations per task (past the cap, iteration returns blocked)
  maxInfraRetries: 3              # Transient harness retries for cheap roles (backoff; exhaustion escalates, never consumes fix rounds)
  maxInfraRetriesExpensive: 1     # Transient retries cap for budget.expensiveRoles
  gateRetries: 1                  # Re-runs for flaky gate detection
  gateTimeoutSec: 900             # Per-gate command timeout (sec); real suites need minutes, not seconds
  storyMaxProdLines: 300          # Advisory sizing hint for reviews (over-budget never rejects a step — no hard gate, no consult on size alone)
  simpleMaxProdLines: 20          # Advisory size bound for simple items (over-budget converts to a no-behavior item, never rejects)
  maxMilestones: 8                # Maximum milestones per plan
  maxItemsPerPlan: 50             # Maximum items per plan
  checkOutputBytes: 4000          # Tail byte cap for check command output
  # No hydration/context-pack byte caps by design: the architect's history and the
  # prepared context pack are injected whole; runaway protection is budgets + turn limits.
  # stepTranscriptWarningBytes defaults to 5242880 (5 MiB) when absent; uncomment to pin:
  # stepTranscriptWarningBytes: 5242880
  # timeoutNudgeSec unset: finalize-nudge retries and interrupted resumes default to HALF the step's own timeout (coherent with 45m-2h turns); pin only to override:
  # timeoutNudgeSec: 300
  # steerPollSec defaults to 60 when absent; uncomment to pin:
  # steerPollSec: 60
  maxEmptyWaves: 3               # Consecutive empty-complete waves before architect consult (instead of another empty wave)
  # Disk-space guard: minimum free disk space required across worktreeRoot,
  # runtime tmp, repoRoot, and system temp filesystems. Preflight fails; engine
  # ticks, steps, and gates raise low-disk-space and stop with exit 10 below this.
  minFreeDiskMb: 2048             # Minimum free disk space (MB) required on repo, worktree, and tmp filesystems

# ==============================================================================
# Budget (§5, §12.5)
# ==============================================================================
# Monetary limits (USD) enforced when harness reports token usage.
# Exceed behavior: item -> consult, iteration -> wave loop break, task ->
# human-stop question + exit 10, step (`perStepUsd`, checked against the
# step's accumulated cost during transient retries) -> stable-id escalation.
budget:
  perTaskUsd: 100
  perIterationUsd: 30
  perItemUsd: 40
  perStepUsd: 25
  expensiveRoles:                 # Roles capped by limits.maxInfraRetriesExpensive
    - architect
    - task-escalation
# ==============================================================================
# Model Diversity (§5, §12.4)
# ==============================================================================
# Enforces model independence between producer and reviewer pairs:
# workhorse vs task-reviewer, architect vs alt-architect (primary models).
# "warn": preflight warning on shared primary model.
# "error": fail preflight on shared primary model.
# "off": disable check.
diversity: warn

# ==============================================================================
# Harness (§4, §5)
# ==============================================================================
# Adapter identifier for agent execution (e.g. "omp", "fake").
harness: omp

# ==============================================================================
# Review Policy & Dispositions (§5, §8.7)
# ==============================================================================
# Configures allowed reviewer dispositions and feedback policies.
# NOTE: the engine currently uses a hardcoded fallback set
# ["fix", "optional", "architect", "human-awareness", "human-async"] plus an
# optional per-agent `reviewPolicy.<agent>` override in item flows; the
# `default:` key below is documentation until it is wired. Keep it as the
# intended default.
# Dispositions:
#   - fix: sends item back to fixLoopTo
#   - optional: appended to feedback on the next fix round; durable debt comes from accept-with-debt
#   - architect: consult path (direct disposition trigger not wired today)
#   - human-awareness: informational tousertoreview item, no forced architect turn
#   - human-async: item blocks awaiting operator response; other items continue
#   - human-stop: blocks terminal success like fix (no immediate exit-10 path wired today)
reviewPolicy:
  default:
    - fix
    - optional
    - architect
    - human-awareness
    - human-async

# ==============================================================================
# Criteria (§5, §8.7)
# ==============================================================================
# Paths to criteria markdown files (resolved relative to plugin root, or to the
# repo root when the key is overridden in <repo>/.factory/pipeline.yaml).
# Missing files are skipped silently (prompts render without that section).
#
# How each file is consumed by the engine:
#   - triage: rendered into the triage step prompt (`triageCriteria` var) and
#     used as the classification matrix for kind selection.
#   - dispositions: rendered into every review-type step prompt
#     (`dispositionsCriteria` var) after filtering to the agent's allowed
#     dispositions from `reviewPolicy` (see formatDispositionsSection).
#     The same allowed set restricts the generated review JSON schema enum.
#   - story-kinds: rendered into PM prompts (`storyKindsCriteria` var) alongside
#     the generated `kinds` guide (one line per flows.story/spike criteria).
# Adding a story/spike kind therefore needs BOTH a flows entry (with criteria
# one-liner, steps, stepFragment where kind-specific, and fixLoopTo naming a
# step of the same kind) AND criteria text in agents/criteria/story-kinds.md.
criteria:
  triage: agents/criteria/triage.md
  dispositions: agents/criteria/dispositions.md
  story-kinds: agents/criteria/story-kinds.md

# ==============================================================================
# Context Pack (§8.1, §12.5)
# ==============================================================================
# Ingest sub-step executed after infra and before the first architect turn
# (skipped for kind `simple`):
# a cheap workhorse agent (fact-finder role/agent, FRESH session) builds a
# condensed, citation-backed context document (context-pack.md) covering module
# maps, signatures, excerpts, conventions, and open questions. No byte cap —
# the turn budget is the bound.
# Expensive architect turns work primarily from prepared context and triage citations
# under an explicit exploration budget instead of broad codebase scans.
# Stale rule: iteration 1 stale iff not done; later iterations stale iff any
# non-.factory file changed since the pack commit (step id `context-pack-{N}`).
contextPack: true

# ==============================================================================
# Tools (§5, §10)
# ==============================================================================
# `defaults`: tools for an agent whose definition carries no tools list.
# `structuredOutput`: tools always appended when the turn needs structured output.
# Per-agent sets live in the agent definition frontmatter, overridable per
# layer via `agents.<name>.tools` (empty = yield-only, subject to
# `structuredOutput` when a schema is attached).
tools:
  defaults: [edit, bash]
  structuredOutput: [yield]

# ==============================================================================
# Prompts (§5, §10)
# ==============================================================================
# Template overrides and additional skill directories.
#
# `overrides` maps a fragment key to a replacement body:
#   - fragment key: agent name ("developer"), step fragment ("steps/develop" or
#     bare "develop"), shared include ("_shared/philosophy"), or system fragment
#     (several spellings incl. ".md" variants are accepted).
#   - value: either a plain string (new body) or an object {body, tools,
#     description}. For agent defs, the object form replaces all three
#     (tools/description default to empty); a plain string keeps the file's
#     frontmatter tools/description.
#   Example:
#   overrides:
#     steps/develop: "Custom develop prompt. Assignment: {{assignment}} ..."
#     reviewer: { body: "Custom reviewer ... {{dispositionsCriteria}}", tools: [read, grep], description: "Custom" }
#   Override bodies may use {{> include}} and {{placeholder}}; missing vars and
#   unknown placeholders fail preflight (checked against KNOWN_VARS).
#
# Shadowing order (first hit wins): in-memory `overrides` -> `extraSkillDirs`
# in order -> built-in agents/ directory.
#
# `extraSkillDirs` semantics: each entry is a directory searched for prompt
# fragments exactly like the built-in agents/ dir (agent defs at top level,
# step fragments under steps/, shared includes under _shared/). Use it for
# project-specific prompt variants without forking the plugin. Entries resolve
# relative to the process cwd; prefer absolute paths in project overrides.
prompts:
  overrides: {}
  extraSkillDirs: []
