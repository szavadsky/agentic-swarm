# Package-default process config. A repo may override any key in .factory/process.yaml.
flows:
  implement-review:
    steps:
      - id: implement
        role: implementer
      - id: review
        role: reviewer
        review: true
        changeRequests: 2
  just-implement:
    steps:
      - id: implement
        role: implementer
  spike:
    steps:
      - id: implement
        role: implementer
      - id: review
        role: reviewer
        review: true
        changeRequests: 0
roles:
  architect: { prompt: architect }
  front: { prompt: front }
  pm: { prompt: pm }
  implementer: { prompt: implementer }
  reviewer: { prompt: reviewer }
  digest: { prompt: digest }
  steward: { prompt: steward }
  plan-checker: { prompt: plan-checker }
  plan-reviewer: { prompt: reviewer }
reminders: 1
