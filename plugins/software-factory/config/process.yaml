# Package-default process config. A repo may override any key in .factory/process.yaml.
#
# Every step names the prompt it renders and the run-config alias it runs on.
# The same prompt may run on another alias without declaring a new role: the
# prompt is the role, the alias is the model choice. A development implement
# turn retries on `implementer-b` instead of repeating the model that failed.
flows:
  implement-review:
    steps:
      - id: implement
        prompt: implementer
        alias: implementer
        alternates: [implementer-b]
        unfinishedPrompt: unfinished-turn
      # QA accepts the work before the reviewer reads it: it gets the checks
      # result and log, verifies the done-when, adds tests where coverage
      # requires them, and sends actionable findings back to the implementer.
      # QA edits to tests and scripts are gated again before review.
      - id: qa
        prompt: qa
        alias: qa
        qa: true
        changeRequests: 2
        deliverable: verdict
      - id: review
        prompt: reviewer
        alias: reviewer
        review: true
        changeRequests: 2
        deliverable: verdict
      # Optional review adjudication: a verdict-only step placed directly after
      # a review re-judges the review's change requests and may discard them.
      # Its outcome is the one the implementer answers, so a discarded finding
      # never reaches it. `all` runs on every change-bearing cycle; `last` only
      # on the final one whose change request is still honored.
      # - id: adjudicate
      #   prompt: adjudicator
      #   alias: reviewer
      #   adjudicate: last

      # Runs only after a merge-step conflict: one turn merges the head into
      # the task branch and resolves it, then checks and re-merges. It is not
      # part of the normal agent sequence.
      - id: resolve
        prompt: steward
        alias: steward
  just-implement:
    steps:
      - id: implement
        prompt: implementer
        alias: implementer
        alternates: [implementer-b]
        unfinishedPrompt: unfinished-turn
      - id: resolve
        prompt: steward
        alias: steward
  # A spike delivers a report, not a merge: it runs on the researcher alias and
  # retries on other task models instead of the one that failed.
  spike:
    steps:
      - id: implement
        prompt: implementer
        alias: researcher
        alternates: [implementer, reviewer]
        unfinishedPrompt: unfinished-turn
      - id: review
        prompt: reviewer
        alias: reviewer
        review: true
        changeRequests: 0
        deliverable: verdict
# The goal-start ingestion sequence: `branch` first, then the `front`
# classifier, then extra prompt steps (e.g. a requirements agent) in list
# order. `branch` and `front` take only their id; the front's prompt and alias
# are the `boundary.front` ones. A step's `when` names the classes it runs
# for; a bigger goal's code map comes from a scout step pinned to
# `when: [bigger]`, not from a `git ls-files` dump in every pack.
ingestion:
  - id: branch
  - id: front
  - id: scout
    prompt: scout
    alias: pm
    deliverable: code map
    when: [bigger]
# The kernel turns outside any task flow. Each names its prompt and the alias
# pre-flight requires; `front` runs on the PM alias, as before. A turn may also
# name the repair ask its missing outcome renders and the product that ask
# calls for; the process `repairPrompt` default and the turn's expectation
# cover steps that name neither.
boundary:
  architect: { prompt: architect, alias: architect, repairPrompt: architect-repair, deliverable: "plan edit or stop decision" }
  digest: { prompt: digest, alias: digest }
  front: { prompt: front, alias: pm, deliverable: "class, task, and pack" }
  intent: { prompt: intent, alias: intent, deliverable: "intent edit" }
  packprep: { prompt: pack-preparer, alias: pack-preparer, deliverable: "pack briefs" }
  plancheck: { prompt: plan-checker, alias: plan-checker, deliverable: "plan verdict" }
  pm: { prompt: pm, alias: pm, deliverable: "task files" }
  steward: { prompt: steward, alias: steward, deliverable: merge resolution }
# Plan review is the architecture flow: one fresh read-only review turn per
# reviewer alias, then, when technical concerns exist and the policy allows it,
# one architect turn on them. Both complete before the PM derives tasks.
architecture:
  planReview: { prompt: review-architect, deliverable: "plan-review findings" }
  reviewers: [plan-reviewer]
  architectReturn: on-technical-concerns
  planReturn: { prompt: architect-review-return, deliverable: "plan edit and marks" }
# Hierarchy depth: 1 is the norm (one architect); 2 adds one subarchitect
# consult per active epic in the architect register, on the architect's alias.
# At depth 1 nothing in this block runs.
hierarchy:
  depth: 1
  subarchitect: { prompt: subarchitect, repairPrompt: architect-repair, deliverable: "epic plan edit or stop decision" }
# A task file names one type; the type owns its flow, kind, output schema and
# the `useWhen` line that tells a planner which work fits it. `development`
# merges, `spike` finishes with findings, `trivial` runs the front's
# single-step path.
taskTypes:
  development:
    flow: implement-review
    kind: development
    schema: outcome
    useWhen: change meant to land in the repo and merge after QA and review
  spike:
    flow: spike
    kind: spike
    schema: outcome
    useWhen: question only evidence answers — finished with findings and never merged
  trivial:
    flow: just-implement
    kind: development
    schema: outcome
    useWhen: small fully understood change with one implement turn and no acceptance step
reminders: 1
# The repair ask a step renders unless it names another template.
repairPrompt: delivery-repair
presets:
  autonomous: { calibration: "You are an autonomous agent with high agency." }
  principal: { calibration: "You are a principal engineer, focused on clarity and robustness." }
  detailed: { calibration: "You provide highly detailed, step-by-step explanations." }
