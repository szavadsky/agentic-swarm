harnesses:
  omp:
    options:
      defaultThinkingLevel: low
      memory:
        backend: off
      autolearn:
        enabled: false
      skills:
        enabled: false
      features:
        unexpectedStopDetection: false
      tools:
        approvalMode: yolo
        xdev: false
      compaction:
        experimentalContextManagement: false
      disabledProviders:
        - native
        - claude
        - codex
        - gemini
        - opencode
        - cursor
        - agents-md
      retry:
        enabled: false
        modelFallback: false
  opencode:
    acpx:
      agent: opencode acp
      raw: true
      compact: true
      effort:
        configId: effort
      usage:
        cache: true
envAllowlist: []
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
limits:
  concurrency:
    overall: 3
    perSubscription: {}
    perModel: {}
  iterations: 1
  planCheckRounds: 2
sessions:
  dir: ../runtime/sessions
  keepRuns: 5
  retention: short
quota:
  resetMinutes: 300
worktreeRoot: ../runtime/worktrees
lsp: true
portability: []
