# Frozen resolved run layer of bootstrap/run/self-quota.yaml before the
# extends split (base + overlay). The shipped file must keep resolving to
# exactly this layer. The architect's fallbacks share the Claude pool and the
# escalation fallback names the Muse account: the fallback-pool-key rule.
aliases:
  architect:
    harness: claude-code
    model: opus
    effort: high
    rotate: []
    subscription: claude
    fallbacks:
      - model: sonnet
        effort: high
        sharesPool: true
      - harness: omp
        model: anthropic/claude-opus-5-5
        effort: high
        sharesPool: true
    timeouts:
      idleMs: 1200000
      wallMs: 14400000
  pm:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    rotate: []
    subscription: openrouter-free
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
    escalateTo: escalation
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  digest:
    harness: omp
    model: "@free"
    rotate: []
    subscription: openrouter-free
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  intent:
    harness: opencode
    model: opencode/beam-free
    rotate: []
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  implementer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    rotate: []
    subscription: antigravity
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
    timeouts:
      idleMs: 1200000
      wallMs: 14400000
  implementer-b:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    rotate: []
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  researcher:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    rotate: []
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  reviewer:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    rotate: []
    subscription: openrouter-free
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
    timeouts:
      idleMs: 1200000
      wallMs: 14400000
  qa:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    rotate: []
    subscription: openrouter-free
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
    timeouts:
      idleMs: 1200000
      wallMs: 14400000
  plan-reviewer:
    harness: opencode
    model: opencode/hy4-flash-free
    effort: high
    rotate: []
    subscription: opencode-free
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
    timeouts:
      idleMs: 1200000
      wallMs: 14400000
  pack-preparer:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    rotate: []
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  plan-checker:
    harness: opencode
    model: opencode/hy4-flash-free
    effort: high
    rotate: []
    subscription: opencode-free
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
    timeouts:
      idleMs: 1200000
      wallMs: 14400000
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    effort: high
    rotate: []
    subscription: claude
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go
    timeouts:
      idleMs: 1200000
      wallMs: 14400000
  steward:
    harness: opencode
    model: opencode/hy4-flash-free
    effort: high
    rotate: []
    subscription: opencode-free
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
harnesses:
  omp:
    options:
      defaultThinkingLevel: low
      memory:
        backend: off
      autolearn:
        enabled: false
      skills:
        enabled: false
      features:
        unexpectedStopDetection: false
      tools:
        approvalMode: yolo
        xdev: false
      compaction:
        experimentalContextManagement: false
      disabledProviders:
        - native
        - claude
        - codex
        - gemini
        - opencode
        - cursor
        - agents-md
      retry:
        enabled: false
        modelFallback: false
  agy:
    acpx:
      agent: agy acp
      raw: true
      effort:
        configId: thought_level
        modelBases:
          gemini-3.8-flash:
            - low
            - medium
            - high
      usage:
        cache: true
    options:
      args:
        - --approve-all
  pi:
    acpx:
      agent: pi
      compact: true
      effort:
        configId: thought_level
      usage:
        cache: true
        command: /session
  codex:
    acpx:
      agent: codex
      compact: true
      effort:
        configId: reasoning_effort
      usage:
        cache: true
  claude-code:
    acpx:
      agent: claude
      compact: true
      effort:
        configId: effort
    options:
      args:
        - --approve-all
  opencode:
    acpx:
      agent: opencode acp
      raw: true
      compact: true
      effort:
        configId: effort
      usage:
        cache: true
envAllowlist: []
priceIds:
  "@free": baidu/ernie-5.5-flash-preview:free
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opencode/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opencode-go/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5
limits:
  concurrency:
    overall: 3
    perSubscription:
      opencode-go: 2
      openrouter-free: 1
      claude: 1
      antigravity: 2
      opencode-free: 1
    perModel: {}
  iterations: 1
  planCheckRounds: 2
sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5
  retention: short
quota:
  resetMinutes: 300
worktreeRoot: ~/.local/share/factory/worktrees
lsp: true
scouts:
  model: openrouter/baidu/ernie-5.5-flash-preview:free
  effort: high
portability: []
