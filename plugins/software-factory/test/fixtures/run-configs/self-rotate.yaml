# Frozen resolved run layer of bootstrap/run/self-rotate.yaml before the
# extends split (base + overlay). The shipped file must keep resolving to
# exactly this layer.
aliases:
  architect:
    harness: omp
    model: anthropic/claude-opus-5-5
    effort: high
    rotate: []
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  pm:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    effort: high
    rotate: []
    fallbacks:
      - model: opencode/deepseek-v4.1-flash-free
    escalateTo: escalation
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  digest:
    harness: opencode
    model: opencode/beam-free
    effort: max
    rotate: []
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  implementer:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    rotate:
      - harness: opencode
        model: opencode/beam-free
        effort: max
      - harness: pi
        model: opencode-go/beam-free
        effort: max
      - harness: codex
        model: deepseek-v4.1-flash
        effort: high
    fallbacks:
      - harness: opencode
        model: opencode-go/deepseek-v4.1-flash
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  implementer-b:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    rotate: []
    fallbacks:
      - harness: opencode
        model: opencode/deepseek-v4.1-flash-free
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  researcher:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    rotate: []
    fallbacks:
      - harness: opencode
        model: opencode/deepseek-v4.1-flash-free
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  reviewer:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    rotate: []
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  plan-reviewer:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    rotate: []
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  steward:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    rotate: []
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  plan-checker:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    rotate: []
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    rotate: []
    fallbacks: []
    timeouts:
      idleMs: 1200000
      wallMs: 3600000
harnesses:
  omp:
    options:
      defaultThinkingLevel: low
      memory:
        backend: off
      autolearn:
        enabled: false
      skills:
        enabled: false
      features:
        unexpectedStopDetection: false
      tools:
        approvalMode: yolo
        xdev: false
      compaction:
        experimentalContextManagement: false
      disabledProviders:
        - native
        - claude
        - codex
        - gemini
        - opencode
        - cursor
        - agents-md
      retry:
        enabled: false
        modelFallback: false
  opencode:
    acpx:
      agent: opencode acp
      raw: true
      compact: true
      effort:
        configId: effort
      usage:
        cache: true
  pi:
    acpx:
      agent: pi
      compact: true
      effort:
        configId: thought_level
      usage:
        cache: true
        command: /session
  codex:
    acpx:
      agent: codex
      compact: true
      effort:
        configId: reasoning_effort
      usage:
        cache: true
envAllowlist: []
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
limits:
  concurrency:
    overall: 3
    perSubscription: {}
    perModel: {}
  iterations: 1
  planCheckRounds: 2
sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5
  retention: short
quota:
  resetMinutes: 300
worktreeRoot: ~/.local/share/factory/worktrees
lsp: false
scouts:
  model: opencode-go/deepseek-v4.1-flash
portability: []
