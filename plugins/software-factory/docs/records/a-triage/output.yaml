kind: epic
rationale: "Spec item 18 is a multi-component subsystem, not a single coherent
  feature: it changes every agent output contract (structured concerns[] +
  remarkable decisions/ADRs), adds a new persisted concern store under the task
  folder (fingerprint ids, dedup, status, source records), inserts reviewer
  triage into all item and plan review paths with a new `dismiss` disposition,
  adds routing into dependency blocking/architect consults/steer mailbox/plan
  debt, defines the worker→reviewer→epic architect→saga architect→human funnel,
  adds ADR blocking classification and human-involvement mode config presets
  with prompt fragments, and surfaces counts in closeups, status and state.yaml.
  Estimated >1500 changed lines across ~20 files (engine flows,
  schemas/artifacts, config schema/default, prompts/agents, derive/status, docs,
  behavior tests), far above the 300-line story budget, and it requires design
  tradeoffs (concern identity scope, triage placement, saga seam while saga
  launches are unimplemented, config shape). It decomposes naturally into
  milestones (contracts/store → triage/dismiss → routing/funnel → ADRs/modes →
  surfacing/docs/tests) spanning multiple waves, which is the epic definition.
  It is not a saga: it is one spec item within a single plugin, with the
  multi-epic launch mechanics for sagas explicitly deferred to spec item 19."
size: ~20 files, >1500 lines (engine flows, schemas, config, agents/prompts,
  derive/status, docs, behavior tests); multiple milestones/waves
risks:
  - Adding reviewer triage to every step multiplies reviewer turns/cost and can
    disturb existing step/simple flows that currently have no review; triage
    must be skippable/cheap.
  - "Stable concern identity and dedup across steps, fix rounds and restarts:
    fingerprint scope/normalization must dedupe repeats without collapsing
    genuinely updated concerns."
  - Blocker routing into dependent-item blocking needs dependency-graph handling
    and architect consults; risk of deadlocks or over-blocking, and behavior
    must stay consistent with existing blocked-by-failure/human-async semantics.
  - Saga architect propagation has no engine substrate yet (independent
    saga/epic launches are spec item 19); the funnel needs a clean seam that
    works for epic-only runs today.
  - Changing all agent output schemas (developer, review, architect plan,
    closeups) risks breaking record repair, schema generation and existing
    behavior tests; backward compatibility for string concerns[] must be
    considered.
  - Human-involvement mode presets must compose with reviewPolicy/dispositions
    and the steer mailbox without making remarkable (non-blocking) items wait;
    mode-specific prompt fragments must remain terse per the prompt-debloat
    rule.
  - state.yaml/status counts must stay derivable and idempotent from committed
    records on restart; close-up re-triage could loop or re-report resolved
    items.
