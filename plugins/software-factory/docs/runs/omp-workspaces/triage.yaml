size: 2 spec items / 13 bullet requirements; est. 30-60 files touched, ~3k-6k
  lines of source+tests+docs; decompose into 5-8 epics with a leading isolation
  fact-finder spike
risks:
  - "omp built-in isolation has a critical failure trap: on subagent
    failure/rejection commitToBranch is skipped and the isolation worktree is
    deleted, so changes are lost unless apply/merge semantics are configured
    correctly; branch naming, cwd, retention and merge-back must be settled by
    the mandated fact-finder spike and proven by a throwaway round-trip in
    preflight"
  - "Two isolation backends (isolation: omp default, isolation: engine option)
    must share one abstraction consumed by task, child-epic and item worktree
    creation, branch naming, commit/merge and cleanup while preserving current
    engine behavior and tests"
  - "Saga with parallel epics conflicts with the current single-task run lock
    and per-task status model: needs multi-workspace launch orchestration,
    epic-vs-saga merge escalation, and upward concern propagation with
    restart/idempotency guarantees"
  - Wave-end merge redesign (conflict-free -> deterministic CI gates -> merged;
    conflicts/red -> workhorse merger -> architect escalation with
    status/worktree/branch pointers) must replace or generalize the existing
    item-level integrate step without regressing the item merge-attempt ledger
    and gates path
  - "Spec 20c cache invariants are easy to break: transport system-prompt
    filenames embed timestamps/random suffixes, and cache correctness depends on
    omp keying by content rather than path; compaction/handoff must never
    rewrite transcripts and prompts/overlay must stay byte-stable"
  - Cache TTLs are provider-opaque and usage/cache-read token accounting may be
    incomplete, so cost-measured defaults for compaction/standby warming are
    uncertain; both must be configurable and default-off unless measurement
    shows a win
  - gc/cleanup must be idempotent, dry-run by default, derive orphaned
    workspaces/branches/runtime files and stale locks from records+git, and
    refuse while a run holds the lock; risk of deleting live or user-owned
    resources and of divergence between records and git reality
  - No-model end-to-end tests through the real omp harness require a scripted
    mock model provider mechanism that is not yet proven; risk of coupling tests
    to omp internals/version and of slow/flaky process-level tests
  - Preflight additions (model/role resolvability, isolation round-trip,
    repo-state checks) must fail fast without heavy side effects or mutation of
    the target repo
  - Commit message/scope must come from agents' structured output (e.g. last
    review summary) with the engine never inventing content; this changes commit
    schemas and interacts with review/integrate records and existing commit
    tests
  - Repo-rules hydration (AGENTS.md is not injected into omp subagent context)
    must reach the architect and every implementer-chain role deterministically
    and be verified end-to-end
  - Docs must accurately cover single task, story waves, epic, saga with
    parallel epics, conflict/escalation paths and status/cleanup/gc; drift
    between docs and the new CLI/merge behavior is likely during a multi-epic
    build
