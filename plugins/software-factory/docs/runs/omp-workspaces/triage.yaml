kind: saga
rationale: "The intent covers factory.v2 spec items 19 and 20 in full: 13 bullet
  requirements spanning isolation-backend abstraction (omp isolation default,
  engine worktrees as an option), preflight hardening (omp/config compatibility,
  real isolation round-trip, model/role resolvability, repo-state consistency),
  idempotent whole-tree status plus cleanup/gc launchers with lock safety,
  commit content derived from agent structured output, a redesigned wave-end
  merge/CI-gate/workhorse-merger/architect-escalation path, saga support where
  each epic is an independent factory launch in its own workspace (parallel
  epics with upward escalation/propagation), architect context economy
  (cache-miss compaction, standby cache warming, cost-measured configurable
  defaults, re-evaluating schema-free telegraphic architect output),
  per-use-case docs, and 'no models' end-to-end tests through the real omp
  harness with a scripted mock provider. The current codebase has only
  engine-managed git worktrees, a per-task status command, no cleanup/gc
  commands, no saga launcher, in-process epics, and no cache/compaction
  management; ARCHITECTURE.md records 19/20 as deliberately deferred to this
  omp-workspaces goal. This is far beyond a story (dozens of files, multiple
  collaborating subsystems, major design tradeoffs, cross-module impact and
  regression risk) and must be decomposed into multiple milestone epics; the
  intent itself says it is expected to be split into epics. The first milestone
  is the mandated fact-finder spike on omp isolation mechanics, followed by
  progressive epics (isolation abstraction, lifecycle CLI, merge saga, context
  economy, docs/e2e)."
