id: rm-ac427a6618
chosen: "Engine-managed git worktrees (`git worktree add` + `omp --cwd`) rather
  than omp `isolated: true` subagent tasks"
alternatives:
  - "omp `isolated: true` with `apply:false` to keep a branch and avoid merging
    into the parent"
  - hybrid eval-kernel host
  - omp extension-only host
why: The prior spike verified omp's isolation runner skips `commitToBranch` when
  the subagent fails or rejects, deleting the temporary worktree and losing all
  branch commits; engine worktrees retain every file and commit regardless of
  exit status and give full control of branch naming/base.
