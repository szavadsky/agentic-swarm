remarkable:
  - alternatives:
      - Re-run all four spikes as new items with fresh paid probes
      - Abandon wave-1 research and leave M1 empty
    chosen: Docs-only salvage of approved wave-1 research via read-only git show
      onto parent branch (spike-findings-recovery-v2)
    why: All four wave-1 spike branches completed research ok + review approved;
      only wave-end merges failed environmentally (merge child worktree lacked
      node_modules, typecheck TS2688). Recovery preserved probe evidence without
      inventing new probes, applied review polish where it corrected evidence
      (probe-26/18 softening, spec-path fix, oMP typo), and recorded the M1
      scenario-to-evidence mapping for iteration-2 planning with zero prod
      lines.
  - alternatives:
      - Required cache fields with migration of historical records
      - Separate cache-only sidecar records
    chosen: Additive optional cache-token fields end to end with zero-default
      aggregation
    why: Usage/StepUsage/record/budget/derive/status all tolerate absent keys
      (verified by legacy/mixed tests + schema tests), so historical
      meta.yaml/state.yaml remain valid and M7 measured-defaults work can start
      accumulating data immediately without a migration.
  - alternatives:
      - Stabilize prompt filename now (content-addressed) in M2
      - Leave transport uncharacterized until M7
    chosen: M2 characterizes transport byte-stability with tests only, pinning
      prompt-filename instability as documented behavior
    why: Spike-cache-key verdict (content-keyed, path-safe) was not yet merged when
      M2 ran; tests-only characterization (tests-only check passed, no prod
      change) locks in byte-identical system-prompt/overlay/prompt-content plus
      argv-differs-only-at-prompt-filename, so M7 stabilization has a
      failing-then-pointing test. Deferred per td-prompt-path.
  - alternatives:
      - Run infra.setup after gate snapshots (count setup artifacts as mutations)
      - Require every item branch to commit node_modules
    chosen: merge-path runs infra.setup in childWt before any gate/target snapshot,
      with gate-shaped failure evidence
    why: Mirrors temp-worktree runner.ts semantics; setup-created untracked files
      (node_modules) become snapshot baseline rather than gate mutations
      (asserted by zero worktree_mutation_detected events); failure fails merge
      with id infra.setup + command + exit + output tail, same evidence shape as
      gate failures.
