  Acceptance: 4 spike docs + RECOVERY.md present with probe evidence; no prod
  code changed; no branch checkouts; no .factory/** writes.


  Constraints: no-behavior kind; no deps; wave-2 parallel (self-contained,
  self-heals node_modules via own develop-step gates).
