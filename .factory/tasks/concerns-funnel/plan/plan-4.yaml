      dismiss, mirroring human-stop; add QA-excludes/reviewer-includes render
      test; keep prompts.test fragment matrix + 15/80 debloat budgets green.
      Verify typecheck + TMPDIR=/tmp bun test."
    kind: story
    milestoneId: m1-dismiss-contract
    prodBudgetHint: 15
    slug: prompts-dismiss-filter
    title: Dismiss criteria row + prompt filtering
  - deps: []
    description: "Test-only (no prod changes): extend
      test/human-involvement-config.test.ts (or concern-contracts suite) with a
      contract test asserting DEFAULT_RAISE_ALLOWLIST (concerns.ts:35-44) agrees
      with the shipped concerns.raiseAllowlist in config/pipeline.default.yaml.
      Answers context-pack Q9 without refactoring either side. Verify typecheck
      + targeted suite."
    kind: test-only
    milestoneId: m2-docs-gates
    prodBudgetHint: 0
    slug: allowlist-agreement-test
    title: Raise-allowlist agreement contract test
  - deps:
      - prompts-dismiss-filter
    description: "Docs closure over landed behavior (source: context-pack §6 D1-D11
      + plan ADRs). ARCHITECTURE: §1 row 18 implemented + deviations; new §8.11
