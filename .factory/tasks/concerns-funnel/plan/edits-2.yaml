items:
  - slug: hydration-fingerprint-caps
    kind: dev
    title: Unified hydration, caps, fingerprint
    assignment: "Own concerns.ts + triage.ts hydration + step-runner injection +
      iteration hydration bytes (no prompt fragments, no router, no epic, no
      ingest/apply). Implement ADR adr-hydration-single-cap + adr-hydrated-sets
      + adr-fingerprint-affects-union:
      triage.hydrateStepConcerns(taskDir,{stepRole,inputBytes?,diffBytes?,taskD\
      iffBytes?,consumer}) where callers compute bytes and callee caps+renders.
      Step-role table: review|qa -> min(diffBytes,2000) with diffBytes=UTF-8 of
      promptVars.diff; wave-close-up|plan-close-up -> min(taskDiffBytes,2000)
      with taskDiffBytes=UTF-8 of git diff parentBranch...HEAD in taskWt via
      production git() with injectable gitFn;
      plan-review|architect-*|develop-family -> min(inputBytes,500) with
      inputBytes=sum of promptVars keys present in KNOWN_VARS[fragment] except
      concernsYaml,humanInvolvementCriteria,debt,steering. Skip rule:
      step-runner computes only when caller promptVars lack concernsYaml
      (iteration-supplied wins). '' when cap=0 or hydrated set empty;
      renderConcernsYaml '' when serialize([]) exceeds cap; standing headings
      remain, assertions count id lines. Delete hydrateConcernsYaml.
      buildArchitectHydration drops concerns section (UTF-8 capped); architect
      turns consume concernsYaml only. Implement
      triage.listHydratedConcerns(taskDir,consumer): review|develop|qa and
      plan-review -> open c-* + open rm-*; closeup -> open+routed c-* + open
      rm-*; architect -> open+routed c-* + open rm-* + dismissed+escalated
      notes; terse shape + pendingResolution whenever present + rm-* as
      {id,kind:remarkable,summary:chosen}; countConcerns stays c-* only.
      Fingerprint identity kind+normalized summary+location; affects merged as
      sorted-union INCLUDING terminal (status preserved,
      detail/severity/affects/escalated merge; triage only reopen); aggregate
      dual-lookup migration: compute new id, if missing scan for legacy same
      kind+norm summary+location and rename-merge with union affects, no GC.
      Behavior tests only: iter2+ plan-review <=500B and <input, wave-close-up
      <=2000B and <taskDiff, open+pending visibility, 0/1/3-byte caps -> '' with
      zero id lines, affects-union no fork + legacy rename stable id, rm-*
      hydration shape, dismissed+escalated in architect set. Verify: bun run
      typecheck + TMPDIR=/tmp bun test. Budget ~250 prod lines."
    outlineRef: hydration-fingerprint-caps
