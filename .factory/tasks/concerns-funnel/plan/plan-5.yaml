iteration: 5
milestones:
  - directionalInterfaces:
      - "step-runner (caller) validates producer outputs against the 6 runtime
        file schemas (callee contract: decisions, developer-output,
        fact-finder-output, plan, plan-closeup shared by architect-closeup,
        wave-closeup): lowercase detail accepted, capital-D Detail rejected with
        step error before any store write; aggregateConcerns/mergeConcern read
        lowercase detail with longest-wins"
      - contract/behavior tests (callers) read lowercase .detail on stored
        concerns (callee shape StoredConcernArtifact.detail);
        test/contracts/schema-detail-normalize.test.ts asserts capital-D absence
        and stays untouched
    id: m0-detail-normalize
    scenarios:
      - Given the 6 runtime file schemas (decisions, developer-output,
        fact-finder-output, plan, plan-closeup incl architect-closeup,
        wave-closeup) plus reference review schema When the contract suites run
        Then lowercase detail validates and capital-D Detail is rejected
      - Given a stored concern with 200-byte detail re-emitted with 20-byte
        detail When aggregateConcerns merges Then the stored 200-byte detail
        survives
      - Given every .Detail read in src and test When swept with :raw reads Then
        none remain outside the intentional absence-assertions in
        schema-detail-normalize.test.ts
      - Given the full suite When gates run with TMPDIR=/tmp Then typecheck and
        bun test pass with no regressions
    title: Detail casing normalization
  - directionalInterfaces:
      - "agents/steps/architect-closeup.md + architect-wave-report.md
        (producers) -> architect agents (consumers): terse concernConfirms
        accept/reject instruction text (note rule for dismiss);
        concernResolutions instruction removed from architect-closeup"
      - "prompts.test.ts (caller) <- fragment line budgets (callee): <=15 added
        lines per fragment, <=80 total; test/docs-concerns.test.ts (guard) <-
        ARCHITECTURE/README/config bytes (unchanged); docs/adr/ <- 2 new
        one-paragraph deviation records"
    id: m1-confirm-instructions
    scenarios:
      - Given agents/steps/architect-closeup.md When read Then it instructs
        concernConfirms accept/reject with the dismiss note rule and no
        concernResolutions instruction
      - Given agents/steps/architect-wave-report.md When read Then it instructs
        concernConfirms for wave-close-up proposals
      - Given the rendered architect-closeup and architect-wave-report prompts
        When checked Then the confirms instruction is present in both, and
        prompts.test fragment matrix plus 15/80 debloat budgets pass
      - Given test/docs-concerns.test.ts When run Then all sentinels pass (no
        ARCHITECTURE regression); given the full suite with TMPDIR=/tmp When
        gates run Then typecheck and bun test pass
    title: Close-up confirm instructions and deviation records
