iteration: 5
milestones:
  - directionalInterfaces:
      - "runtime file schemas (callees: decisions, developer-output,
        fact-finder-output, plan, plan-closeup shared by architect-closeup,
        wave-closeup) <- step-runner validation (caller): lowercase detail
        accepted, capital Detail rejected with step error before any store
        write; aggregateConcerns/mergeConcern carry lowercase detail with
        longest-wins"
      - "file schemas plus StoredConcernArtifact (callees) -> contract and
        longest-wins suites (callers): schemas accept lowercase detail and
        reject capital Detail; stored reads assert lowercase detail;
        negative-casing fixtures keep capital Detail to prove rejection"
    id: m0-detail-normalize
    scenarios:
      - Given the 6 runtime file schemas plus reference review schema When
        test/contracts/schema-detail-normalize.test.ts,
        test/contracts/concern-schemas.test.ts, and
        test/contracts/concern-artifact-types.test.ts run Then lowercase detail
        validates and capital Detail is rejected
      - Given a stored concern with 200-byte detail re-emitted with 20-byte
        detail When aggregateConcerns merges Then the stored 200-byte detail
        survives
      - Given tsc --noEmit and the contract, longest-wins, and epic-saga suites
        When run with TMPDIR=/tmp Then all pass, proving no stale capital reads
        remain (typed reads fail typecheck, casing fails contracts)
      - Given the full suite When gates run with TMPDIR=/tmp Then typecheck and
        bun test pass with no regressions
    title: Detail casing normalization
  - directionalInterfaces:
      - "architect-closeup plus architect-wave-report fragments (callees) ->
        architect agents (callers): final bullet carries the concernConfirms
        accept/reject instruction with dismiss note rule (wave-report scoped to
        wave-close-up proposals) while preserving Raise-concerns and condense
        sentinels; architect-closeup carries no concernResolutions instruction"
      - "ARCHITECTURE §1 row 18 plus §8.11 deviations list (callees) <->
        docs-concerns sentinels (callers): row and body needles agree on six
        deviations including epic-mailbox-isolation; repo docs/adr stubs expose
        Decision paragraphs for the three records"
    id: m1-confirm-instructions
    scenarios:
      - Given agents/steps/architect-closeup.md When read Then the final bullet
        instructs concernConfirms accept/reject with the dismiss note rule,
        keeps Raise-concerns and condense clauses, carries no concernResolutions
        instruction, and the fragment non-empty line count is unchanged
      - Given agents/steps/architect-wave-report.md When read Then the final
        bullet instructs concernConfirms for wave-close-up proposals, keeps
        Raise-concerns and condense clauses, and the fragment non-empty line
        count is unchanged
      - Given the rendered architect-closeup and architect-wave-report prompts
        When checked via prompts.test.ts Then the confirms instruction is
        present in both, concernResolutions is absent from architect-closeup,
        and the fragment matrix plus 15/80 debloat budgets pass
      - Given ARCHITECTURE §1 row 18 and the §8.11 Accepted deviations list When
        read Then both record six deviations including epic-mailbox-isolation
      - Given test/docs-concerns.test.ts and the full suite When run with
        TMPDIR=/tmp Then all sentinels pass including the updated row-18 and
        deviations needles, and typecheck and bun test pass
    title: Close-up confirm instructions and traceability updates
itemOutlines:
  - deps: []
    description: "Normalize concern Detail (capital-D) to detail (lowercase-d, all
      lowercase letters) in the 6 runtime file schemas under
      plugins/software-factory/config/schemas/ (decisions, developer-output,
      fact-finder-output, plan, plan-closeup shared by architect-closeup,
      wave-closeup) + reference-only review.schema.json. TS fix at
      plugins/software-factory/src/core/concerns.ts:74: change the guard's
      capital-D property read to the lowercase-d property read (all-lowercase
      detail), restoring longest-wins. MUST-FIX positive stored reads to
      lowercase-d:
      plugins/software-factory/test/engine/epic-saga-propagate.test.ts:248/307/\
      313/319 AND
      plugins/software-factory/test/contracts/schema-detail-normalize.test.ts:2\
      34/263 longest-wins assertions; sweep
      plugins/software-factory/test/engine/funnel-text-budget.test.ts + any
      others with :raw reads (grep missed verified matches this turn, never rely
      on grep alone). MUST-PRESERVE all negative-casing fixtures capital-D:
      schema-detail-normalize absence assertions + capital-D rejection payloads,
      concern-schemas.test.ts capital-D rejection payloads,
      concern-artifact-types.test.ts capital-D ts-expect-error fixture. Rule:
      positive stored-read assertions flip to lowercase-d; every
      rejection/absence/expect-error fixture keeps capital-D or coverage is
      destroyed. Longest-wins tests already exist -- fix their reads, do NOT add
      duplicates. triage/infra/pm-edit untouched. Verify typecheck + TMPDIR=/tmp
      bun test full suite green."
    kind: story
    milestoneId: m0-detail-normalize
    prodBudgetHint: 30
    slug: schema-detail-normalize-v3
    title: Lowercase detail in producer schemas + merge fix
  - deps:
      - schema-detail-normalize-v3
    description: "Per adr-confirm-field-instructions, after m0 is merged (baseline
      is RED so m1 gates require m0): net-zero single-line in-place replacement
      of the existing final bullet in
      plugins/software-factory/agents/steps/architect-closeup.md
      (concernConfirms accept/reject instruction incl the note rule for dismiss;
      concernResolutions instruction gone) and in
      plugins/software-factory/agents/steps/architect-wave-report.md
