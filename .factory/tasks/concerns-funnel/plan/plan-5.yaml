assumptions:
  - assumption: "Baseline is RED on detail casing, contradicting the context-pack
      467-pass/typecheck-clean claim: :raw reads verify capital-D Detail in
      runtime schemas (developer-output.schema.json:68,
      plan-closeup.schema.json:34),
      plugins/software-factory/src/core/concerns.ts:74 reads existing?.Detail
      (capital-D; type error against lowercase StoredConcernArtifact.detail,
      longest-wins dead),
      plugins/software-factory/test/engine/epic-saga-propagate.test.ts:248/307/\
      313/319 read capital-D, and
      plugins/software-factory/test/contracts/schema-detail-normalize.test.ts:2\
      34/263 read merged[0]!.Detail (capital-D). Gates go green only after m0
      lands. TMPDIR=/tmp still required for the 2 pre-existing head-guard
      failures."
    why: Reviewer-verified on exact bytes; :raw reads plus closeup-4 are
      authoritative. Plan targets red-to-green via m0, with m1 sequenced after
      m0.
  - assumption: Behavior is frozen except Detail->detail normalization, two net-zero
      architect-fragment bullet replacements (+ prompt-render test in
      prompts.test.ts), completion of 3 existing docs/adr stubs, and the
      ARCHITECTURE §1 row 18 + §8.11 deviations bullet + both docs-concerns
      sentinel co-updates. No README/config/prompt-criteria edits; no other
      ARCHITECTURE sections touched.
    why: "Closure iteration: bounding change to verified gaps avoids regressions and
      sentinel/debloat violations while keeping row+body+ADR traceability
      consistent."
  - assumption: "Q4/Q8/Q9 resolved accept-only with no code: byte-capped hydration
      views (triage.ts:151-165,254-286) plus epic-copy truncation are the
      condense contract (stored detail never rewritten); mode presets and
      severity thresholds stay conventionally coupled (engine-deriving presets
      would change config semantics); extra-agent output:review permissive
      fallback is out of closure scope (default triager/non-triager paths
      enforce dismiss via generated enum + isTriager gate, tested)."
    why: All are accepted-semantics or non-default-setup edges; architect decides,
      no operator action needed.
  - assumption: Epic mailbox isolation accepted as the sixth deviation; epic-local
      digests invisible at root is operator-visible behavior.
    disposition: human-awareness
    why: Operators polling the root mailbox would otherwise miss epic-local human-*
      entries; architect decides, operator informed, mirroring the four prior
      awareness items.
techDebt:
  - category: impacting
    description: Capital-D Detail in 6 runtime-bound file schemas rejects lowercase
      detail (review.schema.json reference-only, normalized for consistency);
      mergeConcern reads existing?.Detail (capital-D) so typecheck fails and
      longest-wins is dead; epic-saga (:248/:307/:313/:319) and
      schema-detail-normalize (:234/:263) tests read capital-D, while
      negative-casing fixtures must keep capital-D to prove rejection.
    id: td-detail-casing
    resolution: "Fix in schema-detail-normalize-v3: normalize schemas +
      concerns.ts:74 + all stale positive reads verified by :raw
      (rejection/absence/expect-error fixtures stay capital-D); contract and
      longest-wins tests verify; full gates green."
  - category: adjacent
    description: Pre-existing head-guard failures when TMPDIR sits under
      .factory-runtime; every gate run needs the TMPDIR=/tmp workaround.
    id: td-tmpdir-split
  - category: adjacent
    description: Unapplied spike-saga-commit reviewer optional nits (qualify
      epic-state precedence, prefix inline paths, scope removeWorktree claim,
      fold contextPack key). Consumers apply mentally.
    id: td-spike-nits
adrs:
  - context: The engine settles close-up proposals only via architect
      concernConfirms (step-runner.ts:303-316, concerns.ts:282-306), but
      agents/steps/architect-closeup.md instructs concernResolutions (the
      proposal field, verified last line) and architect-wave-report.md instructs
      neither (verified). A proposal the architect never confirms keeps
      pendingResolution forever, and applyWaveCloseupFallback skips pending
      concerns (concerns.ts:347), so spec :94 resolve/carry silently stalls in
      production while engine tests pass.
    decision: "Fix the fragments with net-zero single-line in-place replacement:
      rewrite the existing final bullet of architect-closeup.md to a terse
      concernConfirms accept/reject instruction with the dismiss note rule, and
      the existing final bullet of architect-wave-report.md to a concernConfirms
      instruction scoped to wave-close-up proposals. Both rewritten bullets MUST
      preserve the Raise-concerns-with-evidence clause and the condense clause
      so the prompts.test matrix sentinels (/Raise concerns/ on all 19
      fragments, /condens/i on triage fragments) keep passing; only
      Resolutions->Confirms plus the dismiss note rule changes. Zero net added
      lines; a prompt-render test in prompts.test.ts locks confirms-present in
      both renders and concernResolutions-absent in architect-closeup, and git
      diff --numstat must show equal insertions/deletions for the two fragments.
      architect-resume.md untouched. No engine/schema changes. Complete the
      existing docs/adr/adr-confirm-field-instructions.md stub with this
      Decision paragraph."
    id: adr-confirm-field-instructions
    title: Architect fragments instruct concernConfirms
  - context: runChildTask accepts rootTaskDir but never reads it; only root runTask
      polls the root mailbox, while epic children write human-* to their own
      task dir mailbox ({childWt}/{orch}/{parent}/{epic}). Blocked child
      questions are forwarded as q-epic-* (epic-propagation.ts:97-129), but
      epic-local digests stay in the epic mailbox and parent answers are not
      copied back down. Wiring child-to-root mailbox routing now is a late-stage
      behavior change with config-semantics blast radius.
    decision: "Accept as the sixth documented deviation for closure: the root
      mailbox is the operator surface; epic-local digest entries are not visible
      at root; child-to-root routing/answer-sync is future work. Complete the
      existing docs/adr/adr-epic-mailbox-isolation.md stub with this Decision
      paragraph; plugins/software-factory/docs/ARCHITECTURE.md §1 row 18 AND the
      §8.11 Accepted deviations list each gain the sixth-deviation entry, with
      the row-18 and §8.11-deviations sentinels in
      plugins/software-factory/test/docs-concerns.test.ts co-updated with the
      same needles in the same diff. Operator notified via human-awareness."
    id: adr-epic-mailbox-isolation
    title: Epic mailbox isolation accepted as deviation
  - context: Worker remarkable[] becomes an open rm-* record hydrated to every
      consumer, but a mailbox digest is written only when a triager emits a
      suggestion matching the rm-* id with a human-* disposition
      (triage.ts:98,334-346); architect ADRs route automatically instead. Spec
      :98 says remarkable items are reported in a digest, never waiting.
    decision: "Accept triage-dependency as spec-consistent (NOT a deviation, so §1
      row 18 and §8.11 are unchanged by this ADR): spec :96 requires remarkable
      decisions to get the same aggregation/triage as concerns, so
      reviewer-triage is the funnel gate, not a bypass. No auto-digest above
      threshold. Complete the existing docs/adr/adr-remarkable-digest-triage.md
      stub with this Decision paragraph. Untriaged remarkables (simple tasks)
      never digest, consistent with adr-funnel-triage-coverage."
    id: adr-remarkable-digest-triage
    title: Worker-remarkable digest requires triager confirmation
