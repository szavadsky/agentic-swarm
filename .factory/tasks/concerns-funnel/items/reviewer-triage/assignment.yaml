title: Workhorse reviewer triage
assignment: "Test-first dev building on concerns-store: workhorse reviewer
  triage (adr-triage-suggestions-dismiss, adr-digest-mailbox,
  adr-routing-derived-state debt predicate). Hydrate steps/review promptVars
  with concernsYaml {id,kind,severity,summary,affects} + terse triage
  instructions with condensing output<input; update agents/reviewer +
  criteria/dispositions + human-involvement fragments. In item-machine review
  writeArtifact with isTriager gate (reviewer only, QA non-triager no-op):
  partitionSuggestions exact-id c-/rm- split, triage ids update concerns/ only
  excluded from fix-loop/approval/normal mailbox; dismiss requires non-empty
  detail -> status dismissed + dismissReason else step errors; routed persists
  disposition; fix-on-concern sets fixRequired once for owning item; human-async
  writes single q-concern-<cid> deduped (normal path skipped). Debt predicate
  (kind tech-debt routed/resolved OR disposition optional routed), no tech-debt
  disposition. Tests: dismiss no routing/mailbox/debt/blocked/approval, routed
  persist, QA no-op, missing detail errors, fix-once, no double mailbox. Run
  TMPDIR=/tmp bun test + typecheck."
