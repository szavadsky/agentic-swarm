suggestions:
  - id: stale-source-epic-test-comment
    disposition: optional
    summary: Stale test comment and redundant cast around source.epic
    detail: "The helper docstring says 'artifacts.ts does not declare it yet', but
      ConcernSource in artifacts.ts now declares `epic?: string` (added by this
      item). The `sourceEpic` cast to `ConcernSource & { epic?: string }` is
      therefore redundant: use `record.source.epic` directly and drop/replace
      the stale comment so the test reflects the current contract. Cosmetic
      only."
    location:
      file: plugins/software-factory/test/engine/epic-saga-propagate.test.ts
      line: 74
  - id: forward-status-filter-undocumented
    disposition: optional
    summary: Open-status filter for forwarded questions is not documented in code
    detail: forwardBlockedQuestions forwards only child questions with `status ===
      'open'` in addition to `blocks.length > 0` (so answered/dismissed child
      questions cannot re-open parent blockers). That is a deliberate, sensible
      narrowing of the assignment's literal blocks filter, but it exists only in
      the developer yield notes; the module doc only says 'questions carrying
      blocks are forwarded'. Document the open-only condition (module doc and/or
      inline why comment), and consider a focused assertion covering an answered
      child question being skipped, so the behavior is self-evident and
      regression-protected.
    location:
      file: plugins/software-factory/src/core/flows/epic-propagation.ts
      line: 112
