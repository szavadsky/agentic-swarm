slug: closeup-triager-cleanup
kind: dev
title: Close-up triager cleanup + dismiss resolutions
assignment: "Per adr-closeup-no-suggestions-triage: drop
  wave-close-up/plan-close-up from isTriagerAgent so composed
  resolveReviewAllowed(p,a,isTriagerAgent(a)) excludes dismiss for close-ups and
  triager set equals {reviewer,plan-reviewer}. Add dismiss to
  CloseupConcernResolution/PendingConcernResolution (artifacts.ts) + local
  ConcernResolution (concerns.ts:16) + wave/plan-closeup schema action enums.
  ingestStepConcerns MUST pre-flight before any mutate: every accept confirm
  whose pending.action==dismiss requires non-empty pending.note else throw
  TriageValidationError (step errors; all statuses+pendings preserved, no
  partial transitions). applyConcernConfirms itself never throws
  TriageValidationError (avoids concerns<->triage cycle). accept+dismiss ->
  dismissed + disposition dismiss + dismissReason=pending.note trimmed + pending
  cleared. Wave fallback never assigns dismiss; kind=blocker stays open.
  Close-up schemas carry no suggestions[]; re-triage honored solely via
  concernResolutions + architect concernConfirms + fallback. Tests:
  review-policy composed triager-set exclusion, closeup-lifecycle dismiss accept
  (with note) + error (without note, preserved state), closeup dismiss enum
  contract case. Verify: typecheck + targeted suites + TMPDIR=/tmp full gates."
