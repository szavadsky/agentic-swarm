      disposition
    - test/engine/routing-human-debt.test.ts::Human mailbox and debt routing
      (§8.7, §18).halts with exit 10 and writes a task/item human-stop mailbox
      entry
    - test/engine/routing-human-debt.test.ts::Human mailbox and debt routing
