assignment: "FINAL RETRY (closes QA-exhausted v3 per decision 026). Baseline is
  RED. Normalize concern Detail (capital-D) to detail (lowercase-d) in 6 runtime
  file schemas under plugins/software-factory/config/schemas/ (decisions,
  developer-output, fact-finder-output, plan, plan-closeup shared by
  architect-closeup, wave-closeup) + reference-only review.schema.json BOTH
  occurrences: suggestions[].Detail (~:33) AND newConcerns[].Detail (~:65) to
  match generated review-schema.ts which already emits lowercase-d for both. TS
  fix at plugins/software-factory/src/core/concerns.ts:74: change guard's
  existing?.Detail capital-D read to lowercase-d detail read, restoring
  longest-wins and StoredConcernArtifact typing. Fix ALL positive stored reads
  to lowercase-d via :raw verification (never rely on grep alone):
  plugins/software-factory/test/engine/epic-saga-propagate.test.ts:248/307/313/\
  319 and
  plugins/software-factory/test/contracts/schema-detail-normalize.test.ts:234/2\
  63 longest-wins assertions; sweep funnel-text-budget.test.ts + any other :raw
  Detail reads. PRESERVE capital-D in all negative-casing fixtures:
  schema-detail-normalize absence assertions + capital-D rejection payloads,
  concern-schemas.test.ts capital-D rejection payloads,
  concern-artifact-types.test.ts capital-D ts-expect-error fixture. Rule:
  positive stored-read assertions flip; rejection/absence/expect-error stay
  capital-D. Do NOT add duplicate longest-wins tests (they exist). Add
  suggestions-casing assertion to reference-review-schema contract test:
  suggestions[].properties.detail exists lowercase-d AND
  suggestions[].properties.Detail absent. Do NOT touch triage/infra/pm-edit.
  Interfaces: step-runner validation -> runtime schemas (lowercase accepted,
  capital rejected pre-write); aggregateConcerns/mergeConcern carry lowercase
  longest-wins; contract suites assert schemas + StoredConcernArtifact. Verify:
  tsc --noEmit clean, TMPDIR=/tmp bun test contracts + longest-wins + epic-saga
  green, then TMPDIR=/tmp full suite green."
