      step-runner now fails any triager step on dismiss-without-detail
      (TriageValidationError) vs prior journaled generic Error. Either scope
      validation message per agent or add triage section to plan-review prompt.
    location:
      file: plugins/software-factory/agents/steps/plan-review.md
