suggestions:
  - id: fix-feedback-includes-triage-ids
    disposition: optional
    summary: Fix-loop feedback includes triage ids instead of findings only
    detail: item-machine builds fix/optional feedback from
      latestReviewOutput.suggestions filtered only by disposition, without
      partitioning triage vs findings. An optional triage (routed debt)
      piggybacks into next develop round as OPTIONAL when a fix co-occurs,
      contradicting 'excluding triage ids from fix-loop' and review.md 'never
      restate triaged concern'. Filter via partitionReviewSuggestions findings
      or exclude known concern ids.
    location:
      file: plugins/software-factory/src/core/flows/item-machine.ts
      line: 523
  - id: render-sheds-before-condensing
    disposition: optional
    summary: renderConcernsYaml sheds entries before dropping affects/truncating
    detail: "Nested loops try all counts per variant, so variant[0] sheds trailing
      entries before variant[1] (drop affects) or truncated variants are tried;
      triedFull also skips full-without-affects. Contradicts docstring order
      'condenses summaries, drops affects, then sheds'. Still meets byte cap, so
      polish: iterate counts outer / variants inner, or key guard by content."
    location:
      file: plugins/software-factory/src/core/triage.ts
      line: 97
  - id: duplicate-partition-and-listing
    disposition: optional
    summary: Exact-id partition and concerns-dir listing triplicated with divergent
