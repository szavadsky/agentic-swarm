      *.yaml, ENOENT-only), item-machine mailbox filter (all *.yaml,
      ENOENT-only). Extract single helper for concern-id set; deprecate old
      partition or delegate.
    location:
      file: plugins/software-factory/src/core/flows/item-machine.ts
      line: 714
