debt:
  - Pre-existing head-guard failures when TMPDIR sits under .factory-runtime
    because step-runner splits on /.factory. Baseline red; green with
    TMPDIR=/tmp. Out of scope.
  - reviewAllowed resolved in two places with non-canonical allowedDispositions
    key and wrong fallback order, so per-agent dismiss could fail schema
    validation.
  - ADR writer persists only title plus context and PlanAdr lacks blocking;
    human-stop contract drifted from exit-10.
  - human-awareness and human-stop ignored, debt derivation ignores routed
    concerns, status lists digest as blocking.
  - "spike-saga-commit merge gate failure is environmental, not content:
    read-only spike with zero prod diff, research ok, review approved; baseline
    test gate is red (2 head-guard TMPDIR failures). Findings accepted as
    authoritative. Unapplied reviewer optional nits carried as debt: qualify
    'epic state ONLY from child-closeup' (isMerged precedence), prefix inline
    paths with plugins/software-factory/, scope removeWorktree claim to epic
    child worktrees, fold contextPack key into findings (strict fact-finder
    schema allows only status/summary/findings/sources/recommendations).
    Consumers must apply these mentally."
  - "[concerns-contracts] Review fallback duplicates canonical dispositions
    instead of importing the constant"
  - "[concerns-contracts] resolveReviewAllowed could return ReviewDisposition[]
    instead of string[]"
  - "[concerns-contracts] resolveStepSchema hardcodes canonical dispositions
    instead of reusing constant"
  - "[concerns-contracts] CONCERN_KINDS set duplicates CONCERN_SCHEMA enum"
  - "[concerns-contracts] isTriager logic duplicated and divergent between
    step-runner and item-machine"
  - "[concerns-contracts] Custom reviewPolicy values accept any string, can
    reintroduce tech-debt"
  - "[spike-saga-commit] Qualify 'epic state derived ONLY from
    child-closeup.yaml' — isMerged takes precedence"
  - "[spike-saga-commit] Inline citation paths missing plugins/software-factory/
    prefix"
  - "[spike-saga-commit] Scope 'no failure-path removeWorktree' claim to epic
    child worktrees"
  - "[spike-saga-commit] contextPack key exceeds strict fact-finder output
    schema"
  - "[spike-text-budget] Cross-check item diffs through production git()
    wrapper, not just wave aggregate"
  - "[spike-text-budget] Add many-concerns case forcing hard truncation at the
    2000-byte cap"
  - "[spike-text-budget] Clarify trim-semantics comment to name TmpRepo trimEnd
    measurement path"
  - "[concerns-contracts-types] ReviewSuggestion.disposition collapses to
    string, dismiss not enforced there"
  - "[concerns-contracts-policy] Deduplicate hardcoded builtin fallback arrays
    to BUILTIN_REVIEW_DISPOSITIONS"
  - "[concerns-contracts-policy] Iteration plan-review prompt dispositions lack
    direct automated coverage"
  - "[concerns-contracts-policy] Single-source builtin fallback arrays to
    BUILTIN_REVIEW_DISPOSITIONS"
  - "[concerns-contracts-policy] Close-up triager marking is inert under current
    schemas; pin with test or comment"
  - "[concerns-contracts-schemas] DeveloperOutputArtifact.concerns type still
    string[] vs structured schema"
  - "[concerns-contracts-schemas] Out-of-scope step-runner fallback fix is
    correct but lacks direct test"
  - "[concerns-contracts-schemas] concernResolutions test allows superset enum"
  - "[concerns-contracts-schemas] TS artifact interfaces lag structured schemas;
    store story must reconcile"
  - "[concerns-contracts-schemas] inferTaskWorktree fix correct but lacks direct
    unit test"
  - "[concerns-store-v2] listOpenConcerns silently skips corrupt YAML instead of
    surfacing it"
  - "[concerns-store-v2] aggregateConcerns validates only remarkable.chosen;
    missing why throws mid-RMW after partial writes"
  - "[concerns-store-v2] KINDS/RANK hardcode enums instead of deriving from
    schema single source"
  - "[concerns-store-v2] reconcile filters by HEAD ls-tree but reads worktree
    files, can ingest dirty outputs"
  - "[concerns-store-v2] Non-dismiss triage to routed leaves stale
    dismissReason/pendingResolution"
  - "[concerns-store-v2] Startup reconcile error journal can throw and crash
    runTask unlike task_error guard"
  - "[concerns-store-v2] listOpenConcerns still silently drops unreadable YAML
    and only validates kind"
  - "[concerns-store-v2] Routed triage clears dismissReason but leaves stale
    pendingResolution; no regression test"
  - "[concerns-store-v2] No regression test for r2 remarkable pre-lock
    validation"
  - "[concerns-store-v2] applyConcernTriage/applyCloseupResolutions can return
    rm-* remarkable records typed as StoredConcernArtifact"
  - "[concerns-store-v2] Concern writes use unscoped commitAll on taskWt,
    sweeping unrelated dirty files into concern commits"
  - "[concerns-store-v2] r2 hardening (routed triage clears dismissReason,
