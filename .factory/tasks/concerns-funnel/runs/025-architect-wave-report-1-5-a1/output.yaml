planDelta: "Amendment 2/3 (scheduling repair, no scope change): waves 4-5 ran
  empty because 9 pending items are orphaned in already-closed waves 2-5. Root
  cause verified in code: iteration wave loop (iteration.ts:700-720) skips
  closed waves, and deriveWaveState (wave.ts:29) carries forward only blocked
  items from past waves, never pending items whose deps merged late; amendment 1
  updated deps without re-waving. Fix: version all 12 pending items to -v2 slugs
  (list in outlines), remove the 12 stale originals via removeItemSlugs, and
  have PM schedule the -v2 chain into fresh waves 6+ in strict topological order
  (store-v2+modes-v2 first and parallel; triages next; derive next; consults
  next; closeups/saga next; docs last). Dependents must sit in strictly later
  waves than their deps, never the same wave. Spike-saga-commit (ready, wave 1,
  zero prod diff) stays as-is: findings authoritative, do not re-run. Gates
  green (test fail->pass improved); operator should update gates-baseline.yaml
  to green."
rationale: "Waves 4 AND 5 both merged 0 items with zero failures and green
  gates: classic scheduling stall, not content failure. 9 pending items sit in
  closed waves 2-5 where the engine never revisits them (verified: closed-wave
  skip + wave filter carries only blocked, not pending). Same-slug outline
  updates do not re-wave (proven by amendment 1). Only fix within budget is
  version-to--v2 + remove originals so PM assigns fresh future waves."
