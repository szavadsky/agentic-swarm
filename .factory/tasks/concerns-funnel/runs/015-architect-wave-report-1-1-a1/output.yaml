  1. DELETE itemOutlines slug=concerns-contracts (superseded by split decision 001 after 2 empty-diff attempts).
  2. ADD concerns-contracts-types (story, m1, deps=[]): artifacts.ts types only — Concern/Kind/Severity/Status, RemarkableDecision, StoredConcernArtifact(+pendingResolution?, source.escalated?), ReviewDisposition+dismiss (no tech-debt), PlanAdr.blocking, PipelineConfig.humanInvolvement+concerns{raiseAllowlist,minDigestSeverity,minBlockingSeverity}, reviewPolicy.default canonical + legacy alias in type. No JSON/runtime. Verify bun run typecheck. Budget <=80 lines.
  3. ADD concerns-contracts-schemas (story, m1, deps=[concerns-contracts-types]): inline shared concern/remarkable partial (NO cross-file $ref) into developer-output, fact-finder-output, qa, poc, test-assumptions, review newConcerns, plan, decisions, wave/plan-closeup(+concernResolutions), architect wave-report/closeup; triage/infra/pm-edit untouched. severity/detail optional (runtime defaults in store); kind strict enum; dismiss detail-required at runtime. Verify typecheck+preflight+1 FakeHarness case in test/engine/concerns-funnel.test.ts (valid pass, unknown kind errors no write). Budget <=200 lines JSON.
  4. ADD concerns-contracts-policy (story, m1, deps=[concerns-contracts-types]): src/core/review-policy.ts resolveReviewAllowed(pipeline,agent,isTriager) per-agent>default>builtin[fix,optional,architect,human-awareness,human-async], legacy allowedDispositions alias, dismiss iff isTriager; wire item-machine+step-runner+iteration+generateReviewSchema; QA never dismiss. Verify typecheck+FakeHarness (reviewer accepts dismiss, QA rejects). Budget <=100 lines.
  5. UPDATE concerns-store deps=[concerns-contracts-types,concerns-contracts-schemas,concerns-contracts-policy] (drop spike-saga-commit; findings authoritative at items/spike-saga-commit/steps/001-research-a1/output.yaml). Append to description binding directives: one file per fingerprint, writeYamlAtomic distinct files, KeyedMutex(taskDir) only for status/source RMW, NEVER wrap commitAll in repo.writeLock.runExclusive (deadlock), explicit taskWt path+immediate commitAll, concerns/** startup recovery+reconcileConcerns from committed records, ingest errors must not change step status.
  6. UPDATE modes-prompts deps=[concerns-contracts-types,concerns-contracts-schemas,concerns-contracts-policy].
  7. UPDATE routing-blocker-derive deps=[reviewer-triage,plan-reviewer-triage,modes-prompts] (drop spike gate); append: collectRoutedBlockers owner derive/task.ts, thread blockedBy into deriveItemState or post-process before every deriveWaveState call.
  8. UPDATE saga-propagate deps=[routing-architect-consult] (drop spike gate); append: copy filtered/condensed child concerns at runChildTask engine.ts:246-274 for every child status + forward child human questions to root mailbox; hydration append LAST (tail-slice) or registered concernsYaml var, recompute before wave-report.
  9. UPDATE funnel-closeups description append spike-text-budget nits: cross-check item diffs via production git() wrapper, add many-concerns 2000B hard-truncation case, clarify trim semantics.
  10. Record u-saga-propagation/u-text-budget spikes as FINDINGS-ACCEPTED (do not re-run spikes); treat spike-saga-commit blocked status as environmental (red-baseline gate, zero prod diff), not content failure.
  11. Operator note: run gates/merges with TMPDIR=/tmp until '/.factory' split fixed; do not schedule new work on the red baseline.
