adrs:
  - context: ARCHITECTURE §5 claims epics inherit the parent task layer, but
      runTaskChild loads only the child task dir pipeline.yaml, so
      humanInvolvement/concerns/reviewPolicy set at root do not apply inside
      epics. Implementing parent-layer inheritance would change config loading
      semantics for all tasks, beyond item-18 closure scope.
    decision: "Document the deviation: per-task selectability holds per task
      directory (each epic child has its own pipeline.yaml), but epic children
      do not inherit the parent task layer. Record in the §1 row 18 rewrite and
      §5; no behavior change."
    id: adr-epic-config-root-only
    title: Epic config inheritance documented as deviation
  - context: isTriagerAgent returns true for wave/plan-close-up and ingest would
      triage their suggestions[], but both close-up schemas set
      additionalProperties:false without a suggestions field, so the path is
      unreachable; real re-triage flows through concernResolutions + architect
      concernConfirms + wave fallback.
    decision: Drop wave-close-up/plan-close-up from isTriagerAgent
      (resolveReviewAllowed no longer advertises dismiss for them); close-up
      re-triage stays exclusively concernResolutions/confirms/fallback. Update
      review-policy tests and correct §10/§8.7 wording. No ingest behavior
      change (close-ups never emitted suggestions).
    id: adr-closeup-no-suggestions-triage
    title: Close-ups removed from triager set
assumptions:
  - assumption: Gates run with TMPDIR=/tmp so the 2 pre-existing head-guard failures
      do not mask regressions.
    why: Baseline red only under .factory-runtime TMPDIR; suite green with
      TMPDIR=/tmp. Out of scope.
  - assumption: Store/triage/routing/funnel/propagation APIs are frozen; iteration 3
      touches only schemas, review-policy triager set, prompt criteria row, and
      docs.
    why: Context pack verifies 18 behavior/contract suites cover the implementation;
      re-planning them risks regressions for no gain.
  - assumption: Autonomous immediate-halt deviation stands as accepted; operator
      already notified via awareness-plan-2-autonomous-halt-deviation.
    why: Decided in iteration 2 planning; iteration 3 only documents it in
      ARCHITECTURE and human-involvement.md.
itemOutlines:
  - deps: []
    description: "Normalize concern Detail->lowercase detail in the 7 file schemas
      (decisions, developer-output, fact-finder-output, plan, plan-closeup,
      wave-closeup, review suggestions + newConcerns) to match artifacts.ts,
      review-schema.ts, ingest, and the contract tests. No TS/runtime changes;
      triage/infra/pm-edit untouched. Verify: contract suites green + bun run
      typecheck + TMPDIR=/tmp bun test."
    kind: story
    milestoneId: m1-contracts-consistency
    prodBudgetHint: 10
    slug: schema-detail-normalize
    title: Lowercase detail in producer schemas
  - deps: []
    description: "Per adr-closeup-no-suggestions-triage: remove
      wave-close-up/plan-close-up from isTriagerAgent in review-policy.ts so
      dismiss is never advertised for them; update review-policy.test.ts
      triager-set assertions. Close-up re-triage remains concernResolutions +
      architect concernConfirms + wave fallback (no ingest change).
      Behavior/contract test: allowed dispositions for close-up agents exclude
      dismiss. Verify typecheck + targeted suite + full gates."
    kind: story
    milestoneId: m1-contracts-consistency
    prodBudgetHint: 30
    slug: closeup-triager-cleanup
    title: Drop close-ups from triager set
  - deps:
      - closeup-triager-cleanup
      - schema-detail-normalize
    description: "Docs closure over final landed behavior. ARCHITECTURE: rewrite §1
      row 18 to implemented with deviations (epic config root-only, close-up
      resolutions path, saga funnel semantics, autonomous immediate halt), add
      §8.11 funnel section, update §3/§5/§6.2/§8.7/§10/§13 per context-pack gap
      list, state canonical ADR format vs historical 3-line notes. README:
      Concerns & human involvement section with per-task pipeline.yaml example +
      status counts/digest output. dispositions.md: add dismiss row (reason
      required, kept). human-involvement.md + §8.11: immediate-halt deviation
      note. pipeline.default.yaml commentary: fragment->agent mapping + landed
      severity semantics. Final gates: typecheck + TMPDIR=/tmp bun test green."
    kind: story
    milestoneId: m2-docs-gates
    prodBudgetHint: 100
    slug: docs-finish-v4
    title: Docs and suite consolidation
iteration: 3
milestones:
  - directionalInterfaces:
      - "producers -> JSON file schemas (lowercase detail,
        additionalProperties:false): validation accepts lowercase detail,
        rejects capital-D; TS/review-schema/ingest already lowercase"
      - resolveReviewAllowed/isTriagerAgent -> wave/plan-close-up excluded from
        triager set (no dismiss advertised); close-up re-triage flows only
        through concernResolutions + architect concernConfirms + wave fallback
    id: m1-contracts-consistency
    scenarios:
      - Given concern outputs with lowercase detail across all producer schemas
        When validation runs Then all pass and detail persists; capital-D Detail
        is rejected
      - Given wave-close-up/plan-close-up agents When allowed dispositions
        resolve Then dismiss is excluded; close-up re-triage works only via
        concernResolutions, architect concernConfirms, and wave fallback
      - Given the full suite When gates run Then typecheck and bun test pass
        with no regressions
    title: Contracts consistency
  - directionalInterfaces:
      - "docs-finish-v4 delivers: ARCHITECTURE §1 row18 + §8.11 +
        §3/§5/§6.2/§8.7/§10/§13, README section, dispositions dismiss row,
        human-involvement.md deviation note, pipeline commentary mapping;
        TMPDIR=/tmp gates green"
    id: m2-docs-gates
    scenarios:
      - Given ARCHITECTURE §1 row 18 When read Then it records item 18
        implemented with explicit deviations and no 'Deliberately not
        hand-built'
      - Given ARCHITECTURE, README, dispositions, and config commentary When
        read Then §8.11 documents store/triage/routing/funnel/ADR/modes,
        dispositions.md documents dismiss, README shows per-task mode selection,
        and commentary matches landed severity/router semantics
      - Given the full suite When gates run with TMPDIR=/tmp Then typecheck and
        bun test pass
    title: Docs and gates
techDebt:
  - category: adjacent
    description: Pre-existing head-guard failures when TMPDIR sits under
      .factory-runtime. Baseline red; green with TMPDIR=/tmp. Out of scope.
    id: td-tmpdir-split
  - category: adjacent
    description: Unapplied spike-saga-commit reviewer optional nits (qualify
      epic-state precedence, prefix inline paths, scope removeWorktree claim,
      fold contextPack key). Consumers apply mentally.
    id: td-spike-nits
  - category: impacting
    description: Capital-D Detail in 7 file schemas rejects lowercase detail under
      additionalProperties:false, breaking runtime validation for file-schema
      producers.
    id: td-detail-casing
    resolution: "Fix in schema-detail-normalize: normalize to lowercase detail;
      contract suites verify."
  - category: impacting
    description: wave/plan-close-up listed as triagers though close-up schemas
      reject suggestions[], advertising an unreachable dismiss path.
    id: td-closeup-triager-dead
    resolution: "Fix in closeup-triager-cleanup: drop close-ups from isTriagerAgent;
      document resolutions/confirms/fallback as the close-up path."
