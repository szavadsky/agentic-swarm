  ## 3. Relevant Excerpts


  ### Identity, dedup and merge (`src/core/concerns.ts:49-99`)

  - Normalization `norm = trim + collapse whitespace + lowercase` (`:49`);
  funnel budgets compare UTF-8 bytes (`:50-51`).

  - Concern id: `c-` + first 10 hex of `sha256(JSON.stringify([kind,
  norm(summary), file|null, line|null]))` (`:53-62`). Remarkable id: `rm-` +
  `sha256([norm(chosen), sorted(alternatives)])` (`:55`).

  - Merge rules: longest detail wins, highest severity wins, `affects`
  union/dedup/sort, status preserved, `escalated` sticky and set when an
  incoming severity exceeds the stored one (`:71-88`).

  - Legacy pre-union files with the same kind/summary/location are rename-merged
  on raise (`:101-121`, deletion `:149`).

  - Mutation is serialized by `KeyedMutex` keyed on `taskDir` and committed as
  one `factory: concerns <message>` commit (`:45-46`, `:232-249`).


  ### Reviewer triage (exact id only) (`src/core/triage.ts:35-50`, `252-263`)

  ```ts

  if (!isTriager) return { triage: [], findings: [...suggestions], fixRequired:
  false };

  const ids = new Set(concernIds);

  const triage = suggestions.filter(s => ids.has(s.id));

  // findings = the rest; fixRequired = triage.some(s => s.disposition ===
  "fix")

  ```

  `applyConcernTriage` refuses non-triagers, requires non-empty `detail` for
  `dismiss`, and writes `status: dismissed` + `dismissReason`, else `status:
  routed` + disposition (`src/core/concerns.ts:252-263`). The step-runner passes
  only ids that existed **before** the step, so a step cannot self-dismiss its
  own findings (`src/core/flows/step-runner.ts:233-240`).


  ### Human router (`src/core/triage.ts:93-136`)

  `human-awareness`, `rm-*` remarkables and dismissed-escalated concerns are
  digest-only; `human-async`/`human-stop` block only at or above
  `minBlockingSeverity` and downgrade to `human-awareness` below it; nothing
  below `minDigestSeverity` is surfaced (`rm-*` is threshold-exempt). Mailbox
  ids are `q-concern-<concernId>` or `q-escalated-<concernId>`, so a re-raise
  does not duplicate a question and `writeQuestion` keeps an existing answered
  file (`src/core/steer.ts:99-106`).


  ### Ingest order after a step (`src/core/flows/step-runner.ts:193-322`)

  1. Collect `concerns`+`newConcerns`, `remarkable`, `suggestions`,
  `concernResolutions`, `concernConfirms`, `concernResolution` (`:198-215`).

  2. Gate raise by `source.agent` against the allowlist; a skip is journaled and
  the step stays ok (`:217-231`).

  3. Capture pre-existing concern ids for exact-id triage (`:233-240`).

  4. Pre-flight architect dismiss-confirmations that need a pending reason,
  before mutating anything (`:242-259`).

  5. `aggregateConcerns` (`:260`) → `applyReviewTriage` (`:261-275`) →
  `applyCloseupResolutions` (`:276`) → decision-level `applyConcernResolution`
  only for `consult-concern-<id>`, `architect-closeup*`,
  `architect-wave-report*` (`:278-301`) → `applyConcernConfirms` +
  propagate-accepted (`:303-316`) → wave-close-up fallback (`:318-321`).

  6. Called only when `finalStatus === "ok"` (`:841-861`); a
  `TriageValidationError` flips the step to error, other ingest failures are
  journaled and do not change step status (`:853-860`).


  ### Hydration caps — “never more text than the code it summarizes”
  (`src/core/triage.ts:234-247`)

  ```ts

  cap = role in {review, qa}      ? min(diffBytes ?? 0, 2000)
      : role in {wave-close-up, plan-close-up} ? min(taskDiffBytes ?? 0, 2000)
      : min(inputBytes ?? 0, 500);
  if (cap <= 0) return "";

  ```

  `renderConcernsYaml` degrades in stages: full records → drop `affects` →
  summary limits 80/40/16/8/4/1 → shed trailing entries; default ceiling 8000
  bytes (`:254-286`). Consumer sets: review/develop see open only; close-ups see
  open+routed; architect additionally sees escalated dismissed; every consumer
  sees open remarkables (`:219-231`). Prompt-var wiring:
  `step-runner.ts:429-449` (caller-supplied `concernsYaml` wins; close-up caps
  measure `git diff parent...HEAD`).


  ### Plan-review triage never requests revisions
  (`src/core/flows/iteration.ts:506-572`)

  `knownConcernIds = listConcernIds(taskDir)` is captured before each round
  (`:512-514`); after the plan-reviewer turn, `partitionSuggestions` removes
  triage ids and only `findings` with `fix` can trigger an architect revision
  (`:561-572`). The plan-reviewer prompt receives `dispositionsCriteria` built
  from its allowed set, which includes `dismiss` (`:537-544`).


  ### Routed blocker → dependent items + architect consult
  (`src/core/derive/task.ts:52-65`, `src/core/flows/iteration.ts:200-229`)

  `collectRoutedBlockers` selects `kind === blocker && status === routed &&
  severity >= minBlockingSeverity` and returns `affects` slugs.
  `blockedByConcern` blocks only pending affected items and cascades over
  declared deps to a fixpoint (`src/core/plan/scheduler.ts:68-78`). In the act
  phase, `consultRoutedBlockers` runs once per routed blocker whose `affects`
  intersects the wave’s blocked set; the decision artifact
  `decisions/concern-<cid>.yaml` makes it restart-idempotent
  (`src/core/flows/consults.ts:319-421`).


  ### Close-up propose/confirm (`src/core/concerns.ts:266-306`, `337-353`)

  Close-ups are non-triagers, so their `concernResolutions` are stored as
  `pendingResolution` only. The architect `concernConfirms` accepts
  (`resolve`→resolved, `carry`→routed/architect, `dismiss`→dismissed with
  pending note, `propagate`→clears local proposal) or rejects (clears proposal).
  `applyWaveCloseupFallback` only touches pre-existing open concerns with no
  pending resolution/disposition: tech-debt→`optional`, others→`architect`,
  blockers stay open, epic copies skipped (`:342-350`).


  ### Epic → saga condensing (`src/core/flows/epic-propagation.ts:35-58`,
  `141-185`)

  Payloads ≤120 bytes stay verbatim; longer ones are truncated to `min(500,
  floor(bytes/2))` on UTF-8 boundaries; summary is prefixed `[epic]`; source
  becomes `epic:{epic}/{record}`; concerns are copied only when open/routed,
  remarkables only when open and only on unfiltered pushes; blocked child
  questions are forwarded with `blocks` remapped from `task` to the parent slug
  (`:97-128`). The push and the parent `child-closeup.yaml` share one lock and
  one commit (`src/core/engine.ts:266-290`).


  ### ADRs (`src/core/flows/adrs.ts:14-37`, `46-71`)

  `autonomous` → blocking ADR uses `human-stop`; `principal`/`detailed` →
  `human-async`; remarkable ADRs always `human-awareness` with no `blocks`.
  Markdown is written only when `adrFolder` is configured; mailbox routing
  always runs. A blocking ADR parks a plan-time iteration before any wave
  (`src/core/flows/iteration.ts:461-471`).


  ### Modes and prompt fragments (`src/core/prompts.ts:64-85`,
  `config/pipeline.default.yaml:384-437`)

  `formatHumanInvolvementCriteria` keeps only the active `## <mode>` section
  plus shared sections (the blocking table), dropping inactive mode headings.
  Shipped presets pair each mode with `minDigestSeverity`/`minBlockingSeverity`;
  those thresholds are separate keys, not derived from the mode.


  ### Counts and status (`src/core/derive/task.ts:369-395`,
  `src/cli/status.ts:106-124`)

  `countConcerns` counts `c-*` files only and is written into `state.yaml` on
  every refresh (`refreshStateYaml` is called after every step,
  `src/core/flows/item-machine.ts:748`). `factory status` prints `Concerns: open
  N | dismissed N | routed N | resolved N`, then splits open mailbox entries
  into blocking vs digest and lists debt.


  ## 4. Existing Tests & Conventions


  **Runner and helpers.** `bun test` (`bun:test`), 71 files. Engine behavior is
  exercised through `runAgentStep` / `runTask` against real temporary git
  repositories (`test/helpers/tmp-repo.ts:1-60`: `createTmpRepo`, deterministic
  git env) with `FakeHarness` scripted per step label
  (`src/harness/fake/fake-harness.ts:25-50`: `scriptOutcome(label, outcome)`,
  `scriptComplete(handler)`). Tests assert observable engine behavior —
  committed files, statuses, mailbox files, prompts, exit codes — not internal
  calls (ARCHITECTURE §13 `docs/ARCHITECTURE.md:451-454`).


