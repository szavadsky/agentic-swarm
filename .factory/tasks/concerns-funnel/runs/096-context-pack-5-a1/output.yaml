  **Conventions worth keeping.** New behavior tests should go through the engine
  with `FakeHarness`; docs changes are guarded by `test/docs-concerns.test.ts`
  which asserts exact needles inside `##` sections and YAML comment banners; any
  assertion added must be base-failing (its needle must not exist on the base
  tree) or it proves nothing.


  ## 5. Open Questions & Uncertainties


  1. **Close-up confirmation prompt/engine mismatch (highest-value gap).** The
  engine expects the architect to settle close-up proposals with
  `concernConfirms` (`src/core/flows/step-runner.ts:303-316`,
  `src/core/concerns.ts:282-306`), but `agents/steps/architect-closeup.md:29`
  instructs `concernResolutions` (the proposal field) and nothing mentions
  confirms. `agents/steps/architect-wave-report.md:32` and
  `architect-resume.md:27` instruct neither, while
  `agents/steps/wave-close-up.md:26` emits proposals. A proposal the architect
  never confirms stays `pendingResolution` forever, and
  `applyWaveCloseupFallback` then skips it (`src/core/concerns.ts:347`). Decide
  whether to fix the fragments (cheap, in scope) or make ingest treat architect
  `concernResolutions` as confirms.


  2. **Remarkable digest is triage-dependent.** `remarkable[]` becomes an open
  `rm-*` record (`src/core/concerns.ts:152-159`) and is hydrated to every
  consumer (`src/core/triage.ts:200-231`), but a mailbox digest is written only
  when a triager emits a suggestion whose id is an `rm-*` id with a human-*
  disposition (`src/core/triage.ts:98`, `:334-346`). Architect ADRs route
  automatically (`src/core/flows/adrs.ts:56-70`); worker remarkables do not.
  Spec `docs/factory.v2.md:98` says remarkable items are “reported (mailbox
  digest), never waiting”. Decide: auto-digest new remarkables above a
  threshold, or document reviewer-triage dependency explicitly.


  3. **Epic mailbox isolation.** `runChildTask` accepts `rootTaskDir`
  (`src/core/engine.ts:221`, passed at `:737`) but never reads it;
  `processSteeringMailbox` is called only from root `runTask`
  (`src/core/engine.ts:432-440`) and writes to the task dir it is given
  (`src/core/steer.ts:90-93`). Child task dirs are
  `{childWt}/{orch}/{parent}/{epic}` (`src/core/engine.ts:234`), so `human-*`
  concerns raised inside an epic land in the epic mailbox, while
  `docs/ARCHITECTURE.md:309` states the active run (root or epic) polls the root
  mailbox. Blocked child questions are forwarded as `q-epic-*`
  (`src/core/flows/epic-propagation.ts:97-129`), but parent answers are not
  copied back down. Decide: wire child→root mailbox, or record as a sixth
  accepted deviation.


  4. **Reviewer “condense” is prompt-only.** `agents/steps/review.md:23` asks
  reviewers to condense or dismiss stale concerns, but `applyConcernTriage`
  persists only status/disposition/reason (`src/core/concerns.ts:252-263`);
  stored `detail` is never rewritten. Condensation is realized only by hydration
  suppression (`src/core/triage.ts:151-165`, `:254-286`) and epic-copy
  truncation (`src/core/flows/epic-propagation.ts:52-58`). Decide whether the
  store should persist a reviewer-condensed summary/detail, or whether the
  byte-capped prompt view is the contract.


  5. **Epic children do not inherit task config** (accepted deviation
  `adr-epic-config-root-only`, `docs/ARCHITECTURE.md:361`). `runChildTask` loads
  `pipelineFor(childTaskDir)` (`src/core/engine.ts:247`); the root
  `humanInvolvement`/`concerns`/`reviewPolicy` overrides do not reach epic
  children. If per-task mode switching must apply inside epics, this needs a
  code change, not docs.


  6. **Triage coverage gaps are accepted** (`adr-funnel-triage-coverage`,
  `docs/ARCHITECTURE.md:360`): only plan generation is plan-reviewer-triaged;
  architect concerns from consult/wave-report/close-up turns aggregate but stay
  open until an architect turn hydrates them or the wave fallback runs;
  simple-task concerns have no reviewer/waves and stay open. Decide whether the
  iteration should narrow this or leave the deviation.


  7. **Counts exclude remarkable decisions**
  (`adr-remarkable-counts-semantics`): `countConcerns` iterates `c-*` only
  (`src/core/concerns.ts:196-217`) and `factory status` prints only those
  (`src/cli/status.ts:106-108`). Digest entries also have no retention/archival
  rule (`docs/ARCHITECTURE.md:356`). Confirm this is acceptable for “state.yaml
  shows counts”.


  8. **Mode presets and severity thresholds are only conventionally coupled.**
  `humanInvolvement` affects ADR disposition (`src/core/flows/adrs.ts:14-18`)
  and prompt criteria (`src/core/prompts.ts:64-85`); digests/blocking are
  governed by `concerns.minDigestSeverity`/`minBlockingSeverity`. The shipped
  presets copy both (`config/pipeline.default.yaml:410-429`), but switching only
  `humanInvolvement` leaves thresholds unchanged. Decide whether presets should
  be engine-derived.


  9. **Static review schema and extra review agents.**
  `config/schemas/review.schema.json:22-42` still lists `dismiss`
  unconditionally; no `src/` code references it (tests only). Runtime schemas
  are generated per agent (`src/core/flows/step-runner.ts:117-128`,
  `src/core/records/review-schema.ts:5-12`). An extra agent configured with
  `output: review` does not match the hardcoded reviewer/qa/plan-reviewer branch
  and falls through to `${agent}.schema.json` → permissive fallback
  (`src/core/flows/step-runner.ts:159-178`), which can admit `dismiss` for a
  non-triager. Confirm no non-triager path can emit `dismiss`, or add a generic
  `output`-based schema mapping.


  10. **Fire-test evidence is operational.** Spec `docs/factory.v2.md:103`
  requires switching modes via config between launches and a mailbox with only
  funnelled, confirmed, low-noise items. `docs/FIRE_TEST.md:43`, `:51` names
  this exact check, but no unit test performs two `runTask` launches with a mode
  change; evidence must come from the self-host launches.


  11. **Pre-existing, not item-18: architect hydration default differs.**
  `src/core/flows/iteration.ts:279` uses `limits.hydrationBytes ?? 65536` while
  `src/core/loops.ts:24` and `config/pipeline.default.yaml:333` default to
  `40000`. The configured value wins in normal runs; only a config missing
  `hydrationBytes` hits the inconsistency. Do not fold this into item 18 unless
  the iteration is explicitly closing adjacent holes.
