      commit deps only concerns-contracts, so risky impl precedes findings.
      Parallel items (maxParallelItems 4) sharing taskWt risk index.lock/lost
      update. Add spike dep to concerns-store or narrow ADR to hypothesis;
      define serialization + restart idempotency.
    location:
      file: plugins/software-factory/src/core/flows/item-machine.ts
      line: 707
  - id: human-stop-redefinition
    disposition: fix
    summary: human-stop redefined from exit-10 halt to blocked without contract update
    detail: ADR/scenario redefines stop as blocked-terminal with engine continues
