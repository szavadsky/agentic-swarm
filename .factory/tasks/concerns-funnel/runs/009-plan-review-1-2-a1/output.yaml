status: changes_requested
summary: Bounds pass (5/8 milestones, 15/50 items, unique slugs, acyclic) but
  triage/routing/funnel contracts ambiguous, scenarios unfalsifiable, spike
  ordering broken
suggestions:
  - id: triage-findings-conflation
    disposition: fix
    summary: suggestions[] reuse conflates concern routing with
      fix-loop/mailbox/approval triggers
    detail: "Exact-id partitions triage vs findings but
      hasAsync/hasIssues/mailbox/plan-approval process ALL suggestions
      (item-machine 711-760, iteration 481). Routing as fix would spuriously
      trigger fix-loop/plan-revise; routing as human-async double-writes mailbox
      (concern route + normal handling). Need partition contract: triage ids
      update concerns/ only, excluded from fix-loop/approval triggers, mailbox
      dedup; define fix-on-concern-id semantics."
    location:
      file: plugins/software-factory/src/core/flows/item-machine.ts
      line: 748
  - id: tech-debt-disposition-invalid
    disposition: fix
    summary: Plan invents tech-debt disposition absent from ReviewDisposition enum
    detail: M2 scenario lists fix/architect/human-*/tech-debt dispositions and M4
      auto-routes tech-debt, but ReviewDisposition is
      fix|optional|architect|human-awareness|human-async|human-stop with no
      tech-debt. Breaks generateReviewSchema enum validation. Must define debt
      routing as (kind==tech-debt && routed) or optional-disposition, or add new
      disposition with policy/schema/handler updates.
    location:
      file: plugins/software-factory/src/core/artifacts.ts
      line: 288
  - id: reviewpolicy-resolver-dismiss
    disposition: fix
    summary: ReviewPolicy precedence and dismiss injection for triagers undefined
    detail: Plan promises canonical reviewPolicy.default + dismiss for triagers but
      omits precedence (per-agent > default > builtin), dismiss injection rule
      (auto-append for triagers vs explicit allow), and QA exclusion. Current
      item-machine fallback is legacy ?? agent ?? builtin (wrong order) and
      step-runner reads only legacy key; generateReviewSchema has no dismiss.
      Need resolveReviewAllowed(pipeline,agent,isTriager) contract used by
      prompt+schema paths.
    location:
      file: plugins/software-factory/src/core/flows/item-machine.ts
      line: 631
  - id: triage-persistence-gating
    disposition: fix
    summary: QA non-triager unenforceable; dismiss reason has no field mapping
    detail: step-runner gives QA review schema yet plan says QA never triages;
      item-machine writeArtifact triages any suggestions output without
      agent/stepId gate, so QA matching id would triage. ReviewSuggestion lacks
      reason field but scenarios require dismissReason persisted. Need isTriager
      gate (reviewer/plan-reviewer/close-up only) and reason mapping (detail
      required when dismiss+match -> dismissReason) with schema/code
      enforcement.
    location:
      file: plugins/software-factory/src/core/flows/step-runner.ts
      line: 93
  - id: store-spike-ordering
    disposition: fix
    summary: Immediate taskWt commit not gated by race/restart spike
    detail: ADR decides direct taskWt writes + immediate commit, but
      spike-saga-commit verifying race/restart/derive boundary gates only
