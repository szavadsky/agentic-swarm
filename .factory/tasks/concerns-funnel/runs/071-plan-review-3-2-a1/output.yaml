  - id: closeup-dismiss-validation-placement
    disposition: fix
    summary: Dismiss-note validation placement ambiguous; risks import cycle and
      partial transitions
    detail: "Interface says ingest->applyConcernConfirms requires note else
      TriageValidationError, but applyConcernConfirms takes only id|confirm
      (concerns.ts:280) and triage.ts imports from concerns.ts. Throwing
      TriageValidationError inside concerns.ts creates concerns<->triage cycle;
      in-patch validation inside mutate (sequential writes, concerns.ts:230)
      commits early confirms before later validation fails, violating 'no
      transition / keeps pending'. Item text says validation in
      ingestStepConcerns (which already imports the error) — correct — but
      interface + ADR do not state pre-flight. Revise interface + ADR: ingest
      pre-validates all accept-on-dismiss pendings have non-empty pending.note
      before any mutate; callee never throws TriageValidationError."
    location:
      file: plugins/software-factory/src/core/concerns.ts
      line: 279
  - id: closeup-dismiss-contract-gaps
    disposition: fix
    summary: Dismiss contract omits local type, reason source, disposition, pending
      clearing, enum test
    detail: "Plan adds dismiss to CloseupConcernResolution/PendingConcernResolution
      + wave/plan-closeup enums but omits concerns.ts:16 local ConcernResolution
      used by applyCloseupResolutions. 'dismissReason from note' does not say
      pending.note (proposal reason) vs confirm.note (architect note).
      'dismissed + dismissReason' omits disposition=dismiss (review triage sets
      it, concerns.ts:257) and pending cleared vs preserved. Contract test for
      closeup resolutions (concern-schemas.test.ts closeup case) must also cover
      dismiss. Revise item + ADR: update all 3 types, dismissReason=pending.note
      trimmed, accept=>dismissed+disposition dismiss+pending cleared, validation
      error=>status+pending preserved."
    location:
      file: plugins/software-factory/src/core/concerns.ts
      line: 16
  - id: triager-scenario-indirection
