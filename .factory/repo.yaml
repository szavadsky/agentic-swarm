baseBranch: factory-v3
artifactRoot: .factory/artifacts
setup:
  - bun install --cwd plugins/software-factory --frozen-lockfile --silent
gates:
  - id: typecheck
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory typecheck
  - id: tests
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory tests
  - id: format
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory format
  - id: lint
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory lint
  - id: schema-validation
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory schema-validation
