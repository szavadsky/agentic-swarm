# The repo layer: tracked config shared by every run of this checkout. The file
# is also the layer's commented example — each key says why this repo sets it,
# so a new repo can copy the shape and change the reasons.

# tasks fork from and merge back into this branch; this repo integrates on its
# own long-lived branch, not upstream main
baseBranch: factory-v3
# goal directories live here, inside the repo but gitignored by the backend
artifactRoot: .factory/artifacts
# the artifact store, selected by backend name rather than by where a path points
artifacts:
  backend: folder  # a plain gitignored directory: artifacts stay local and out of task branches
# commands that make a fresh checkout runnable before any gate runs
setup:
  # install from the lockfile so every task branch gates on the same dependencies
  - bun install --cwd plugins/software-factory --frozen-lockfile --silent
# the checks every task branch and the base run in this order; a base red is warned once, not fatal
gates:
  - id: typecheck  # the compiler gate's name in reds and reruns; a type error anywhere fails the task
    # the exact command a gate run executes, from the worktree root
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory typecheck
    # environment exported to the command, with each directory created per worktree
    env:
      TMPDIR: .cache/gate  # this gate's scratch root, off shared /tmp so concurrent runs never collide
    # tsc summary lines are noise in the exit-code-and-log fallback; diagnostics stay findings
    format:
      noise:
        - '^\d+ errors?\b'
        - '^Found \d+ errors?(?: in \d+ files?)?\.$'
  - id: tests  # the suite gate's name in reds and reruns, and the owner of the junit report
    # the same entry point, with the gate id as its argument
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory tests
    # environment exported to the command, with each directory created per worktree
    env:
      TMPDIR: .cache/gate  # this gate's own scratch root, never shared with another worktree
    # the suite's wall is the test-suite-optimize cut, not this ceiling; 300 is the 5-minute goal the parallel runner now meets
    timeoutSec: 300
    # the machine report the kernel reads to name failed cases on base too
    format:
      junit: .cache/gate/junit.xml  # run-tests.ts writes it here (FACTORY_JUNIT_PATH); missing or empty is red
      # bun test and run-tests.ts banner/summary lines when a fallback reads raw log lines
      noise:
        - '^-{3,}$'
        - '^bun test v\d'
        - '^tests gate: wall \d'
        - '^\d+ (?:pass|fail|skip|todo|errors?)\b'
        - '^\d+ expect\(\) calls$'
        - '^Ran \d+ tests? across '
  - id: format  # the formatter gate's name in reds and reruns; any reformat diff is a red
    # the same entry point, with the gate id as its argument
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory format
    # environment exported to the command, with each directory created per worktree
    env:
      TMPDIR: .cache/gate  # this gate's own scratch root, never shared with another worktree
  - id: lint  # the lint gate's name in reds and reruns; its own script decides what is an error
    # the same entry point, with the gate id as its argument
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory lint
    # environment exported to the command, with each directory created per worktree
    env:
      TMPDIR: .cache/gate  # this gate's own scratch root, never shared with another worktree
  - id: schema-validation  # the schema gate's name in reds and reruns; it validates this file too
    # the same entry point, with the gate id as its argument
    command: plugins/software-factory/scripts/gates.sh plugins/software-factory schema-validation
    # environment exported to the command, with each directory created per worktree
    env:
      TMPDIR: .cache/gate  # this gate's own scratch root, never shared with another worktree

# the per-cause default the PM's stall turn reads before it decides a park; the
# PM may choose any decision the park's records and branch support, and a cause
# with no entry here is the architect's (`leave`)
parkRoutes:
  # a failed turn usually leaves its work on the kept branch
  failed:
    action: amend
    reason: the work and the agent's evidence are on the kept branch
    exception: the same failure repeats or the worktree sits at base; replace
  # a task that outgrew its scope usually needs a wider brief, not new work
  upscope:
    action: amend
    reason: the kept work is usually done and the task's scope too narrow
    exception: the work needs a different seam or milestone; split or replace
  # both conflicts are resolved by the first turn that merges the head
  conflict:
    action: amend
    reason: the first turn merges the head into the kept branch and resolves the conflict in-turn
    exception: the conflict is semantic, in intent rather than files
  base-conflict:
    action: amend
    reason: the first turn merges the head into the kept branch and resolves the conflict in-turn
    exception: the conflict is semantic, in intent rather than files
  # the kept work stands once the turn stops writing outside its worktree
  containment:
    action: amend
    reason: the kept work stands once the turn stops writing outside its worktree
    exception: kernel containment is still broken
  # a red gate is fixed on the branch, not by a new task
  gates:
    action: amend
    reason: fix the named gate on the kept branch
    exception: the gate is already red on base or the repo config
  # an empty turn beside sufficient work means the brief was the problem
  empty-diff:
    action: amend
    reason: the kept work was sufficient; the brief or the direction was not
    exception: the branch holds nothing the head lacks and the task is superseded; replace
  # the same tree twice means the approach, not the branch, is wrong
  no-progress:
    action: amend
    reason: keep the branch and change the approach
    exception: the same tree repeats after the alternate; replace
  # a spent turn budget is an environment fact, not a task failure
  budget:
    action: amend
    reason: no code change is owed; the turn budget is gone from head
    exception: the counter recurs on head; fix it, not the task
  # a steer is answered in the brief and the kept branch reruns
  steer:
    action: amend
    reason: answer the steer in the brief and rerun the kept branch
    exception: the steer changes the milestone or intent
  # a rejected premise, a design blocker, a contract breach or a broken
  # environment is direction, not a retry
  review-rejected:
    action: leave
    reason: a rejected premise is a direction decision for the architect
    exception: the rejection names concrete findings and the premise stands; amend
  blocked:
    action: leave
    reason: a design or approach blocker is the architect's
    exception: the park is a test or environment conflict; amend
  refused:
    action: leave
    reason: a refused turn means the ask and the agent disagree on the contract
    exception: the ask can be restated in the brief; amend
  invalid-outcome:
    action: leave
    reason: the contract breach needs the architect's read
    exception: the kept work is complete and the breach is mechanical; amend
  infra:
    action: leave
    reason: the gate or environment could not start
    exception: the cause is transient and the same gate passed elsewhere; amend
  setup:
    action: leave
    reason: the environment broke before the first turn
    exception: the setup command is fixed on head; amend
  stuck:
    action: leave
    reason: the flow has no next action; that is a plan or config problem
    exception: the flow or task type is now configured; amend
