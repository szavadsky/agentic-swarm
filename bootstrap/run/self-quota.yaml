# Self-run, full rotation (iteration 46 forward, owner 2026-11-16/17):
# A-shape continues (claude-code architect, 5 clean outings). PM/review/QA
# flip back to ernie-first (hy4 ran i45 with one ernie quota hit; daily
# recovered). Mechanical digest flips back to literal `@free` (Go-hy4 ran
# i45 clean). Implementer cycles to agy (deepseek45 → agy46). Subscriptions
# + caps kept; iterationUsd off per owner call. pi/codex/opencode-CLI Go
# still out (sub A).
aliases:
  architect:
    harness: claude-code
    model: opus
    effort: high
    subscription: claude
    timeouts:
      wallMs: 14400000 # 4 h: single turns must not die on the 1 h default
    fallbacks:
      - model: sonnet
        effort: high
      - harness: omp
        model: anthropic/claude-opus-5-5
        effort: high
  pm:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    escalateTo: escalation
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  digest:
    harness: omp
    model: "@free"
    subscription: openrouter-free
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  implementer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    subscription: antigravity
    timeouts:
      wallMs: 14400000 # 4 h: suite-heavy turns (20x reruns) exceed 1 h
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
  implementer-b:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go
  researcher:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go
  reviewer:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  qa:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  plan-reviewer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    subscription: antigravity
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  plan-checker:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    subscription: antigravity
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    effort: high
    subscription: claude
    timeouts:
      wallMs: 14400000 # 4 h: fix turns run suites too
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
  steward:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    fallbacks:
      - harness: agy
        model: gemini-3.8-flash
        effort: high

harnesses:
  # omp is native; the unattended policy is opaque overlay keys here, not code.
  omp:
    options:
      defaultThinkingLevel: low
      memory: { backend: off }
      autolearn: { enabled: false }
      skills: { enabled: false }
      features: { unexpectedStopDetection: false }
      tools: { approvalMode: yolo, xdev: false }
      compaction: { experimentalContextManagement: false }
      disabledProviders: [native, claude, codex, gemini, opencode, cursor, agents-md]
      retry: { enabled: false, modelFallback: false }
  # No `compact`: agy submits `/compact` to the model as a prompt, compacts
  # nothing and still answers end_turn (compaction-probe.md §2).
  agy:
    acpx:
      agent: agy acp
      raw: true
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
    options: { args: [--approve-all] }
  pi:
    acpx:
      agent: pi
      compact: true
      effort: { configId: thought_level }
      usage: { cache: true, command: "/session" }
  codex:
    acpx:
      agent: codex
      compact: true
      effort: { configId: reasoning_effort }
      usage: { cache: true }
  # `/compact` is an adapter command here: the record carries a `Compact
  # conversation` tool call, 16512 -> 3492 tokens at $0.00 reported
  # (compaction-probe.md §1).
  claude-code:
    acpx:
      agent: claude
      compact: true
      effort: { configId: effort }
    options: { args: [--approve-all] }
  # The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
  # data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
  # Live effort options are none/high/default (`set effort max` rejected,
  # probed 2026-11-16) — high is this harness's real max.
  opencode:
    acpx:
      agent: opencode acp
      compact: true
      raw: true
      effort: { configId: effort }
      usage: { cache: true }

scouts:
  model: openrouter/baidu/ernie-5.5-flash-preview:free
  effort: high

# Harness model id -> OpenRouter model id, only where matching cannot resolve.
# @free maps to its primary's $0 row (ernie-free); omp-internal Go hops are
# invisible to pricing — limitation journaled, steered as observation.
priceIds:
  "@free": baidu/ernie-5.5-flash-preview:free
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opencode/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opencode-go/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency: { overall: 3, perSubscription: { opencode-go: 2, openrouter-free: 1, claude: 1, antigravity: 2, opencode-free: 1 } }
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
