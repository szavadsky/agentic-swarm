# Self-run, full-harness rotation (iteration 35 forward, owner 2026-11-16):
# the wheel turns back — architect claude-code, implementer pi, reviewer codex,
# PM omp, digest opencode, steward agy, escalation omp. Alternation A/B across
# iterations: i35 re-tests claude-code as architect (second data point after
# i33's 2 infra crashes saved by the omp fallback); agy gambles on steward
# after spending $0.92 as PM in i34. Effort levels are learned live at
# pre-flight since i34 (no `levels` in config) — every effort below already
# ran in production. Reviewer is task-grade (INTENT): codex/deepseek reviews
# its pi/deepseek sibling in a different context and focus. i32 was
# muse-implements; i33-i35 deepseek-implements on alternating harnesses
# continues the unsettled muse-vs-deepseek comparison.
aliases:
  architect:
    harness: claude-code
    model: opus
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: single turns must not die on the 1 h default
    fallbacks:
      - model: sonnet
        effort: high
      - harness: omp
        model: anthropic/claude-opus-5-5
        effort: high
  pm:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    escalateTo: escalation
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        effort: max
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
  digest:
    harness: opencode
    model: opencode/beam-free
    effort: high
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        effort: high
  implementer:
    harness: pi
    model: opencode-go/deepseek-v4.1-flash
    effort: xhigh
    timeouts:
      wallMs: 14400000 # 4 h: suite-heavy turns (20x reruns) exceed 1 h
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: xhigh
      - harness: opencode
        model: opencode-go/deepseek-v4.1-flash
        effort: high
  reviewer:
    harness: codex
    model: deepseek-v4.1-flash
    effort: max
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - model: muse-spark-1.3-contributor
        effort: max
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    timeouts:
      wallMs: 14400000 # 4 h: fix turns run suites too
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
  steward:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    fallbacks:
      - harness: pi
        model: opencode-go/deepseek-v4.1-flash
        effort: high

harnesses:
  agy:
    acpx:
      agent: agy acp
      raw: true
      args: [--approve-all]
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
  pi:
    acpx:
      agent: pi
      compact: true
      effort: { configId: thought_level }
      usage: { cache: true, command: "/session" }
  codex:
    acpx:
      agent: codex
      compact: true
      effort: { configId: reasoning_effort }
      usage: { cache: true }
  claude-code:
    acpx:
      agent: claude
      effort: { configId: effort }
  # The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
  # data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
  # Live effort options are none/high/default (`set effort max` rejected,
  # probed 2026-11-16) — high is this harness's real max.
  opencode:
    acpx:
      agent: opencode acp
      compact: true
      raw: true
      effort: { configId: effort }
      usage: { cache: true }

# No scouts block while the architect is claude-code: scouts are consumed only
# by OmpHarness (cheap subagent pin), but pre-flight checks scouts.model
# against the architect's harness — no one id is both omp-usable and
# claude-code-listed. The B-shape (omp architect) restores scouts. See
# steer-i35-scouts-harness.md for the kernel-side observation.

# Harness model id -> OpenRouter model id, only where matching cannot resolve.
# Prices come from OpenRouter's model list; opencode is the only acpx harness
# that reports a cost, so pi/codex/claude/agy ids stay unpriced (unknown, never
# $0) until real rates exist (agy precedent, i32). Beam has no beam-suffixed
# OpenRouter id, hence the explicit map (self-acpx.yaml precedent); bare
# opus/sonnet map to their claude ids (i33 landing).
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency: { overall: 3 }
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
