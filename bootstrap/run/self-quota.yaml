# Self-run, full rotation (iteration 41 forward, owner 2026-11-16):
# A-shape (claude-code architect reinstated per owner call, approve-all flag
# + omp fallback intact) with the new leg rotation: mechanical digest on
# omp/Go-hy4:xhigh (`@free` joins when the pre-flight alias bug is fixed —
# steered); PM/task across agy/gemini + omp-Go muse/deepseek at max.
# Go via omp is subscription B (live); pi/codex/opencode-CLI Go (sub A) still
# out ~13d. i41: muse implements (2nd data point), deepseek reviews.
aliases:
  architect:
    harness: claude-code
    model: opus
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: single turns must not die on the 1 h default
    fallbacks:
      - model: sonnet
        effort: high
      - harness: omp
        model: anthropic/claude-opus-5-5
        effort: high
  pm:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    escalateTo: escalation
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
  digest:
    harness: omp
    model: opencode-go/hy4-flash-free
    effort: xhigh
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
  implementer:
    harness: omp
    model: opencode-go/muse-spark-1.3-contributor
    effort: max
    timeouts:
      wallMs: 14400000 # 4 h: suite-heavy turns (20x reruns) exceed 1 h
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        effort: max
  reviewer:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
  plan-reviewer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  plan-checker:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    timeouts:
      wallMs: 14400000 # 4 h: fix turns run suites too
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
  steward:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    fallbacks:
      - harness: agy
        model: gemini-3.8-flash
        effort: high

harnesses:
  agy:
    acpx:
      agent: agy acp
      raw: true
      args: [--approve-all]
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
  pi:
    acpx:
      agent: pi
      compact: true
      effort: { configId: thought_level }
      usage: { cache: true, command: "/session" }
  codex:
    acpx:
      agent: codex
      compact: true
      effort: { configId: reasoning_effort }
      usage: { cache: true }
  claude-code:
    acpx:
      agent: claude
      args: [--approve-all]
      effort: { configId: effort }
  # The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
  # data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
  # Live effort options are none/high/default (`set effort max` rejected,
  # probed 2026-11-16) — high is this harness's real max.
  opencode:
    acpx:
      agent: opencode acp
      compact: true
      raw: true
      effort: { configId: effort }
      usage: { cache: true }

scouts:
  model: openrouter/baidu/ernie-5.5-flash-preview:free
  effort: high

# Harness model id -> OpenRouter model id, only where matching cannot resolve.
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opencode/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opencode-go/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency: { overall: 3 }
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
