# Self-run, spendable-legs reroute (iteration 19 forward): task work on the
# owner-ordered ladder strongest->weakest — omp/muse, agy/gemini,
# omp/deepseek, omp/ernie 5.5 — beam and inkling are mechanical tiers only
# (digest, commits). Reviewer is a task-grade model (INTENT): same family
# reviews its own sibling in a different context and focus.
aliases:
  architect:
    harness: omp
    model: anthropic/claude-opus-5-5
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: single turns must not die on the 1 h default
  pm:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    escalateTo: escalation
  digest:
    harness: opencode
    model: opencode/beam-free
    effort: max
  implementer:
    harness: omp
    model: opencode-go/muse-spark-1.3-contributor
    effort: max
    timeouts:
      wallMs: 14400000 # 4 h: suite-heavy turns (20x reruns) exceed 1 h
    fallbacks:
      - opencode-go/deepseek-v4.1-flash
      - openrouter/baidu/ernie-5.5-flash-preview:free
  reviewer:
    harness: omp
    model: opencode-go/muse-spark-1.3-contributor
    effort: max
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - opencode-go/deepseek-v4.1-flash
      - openrouter/baidu/ernie-5.5-flash-preview:free
  reviewer-agy:
    harness: agy
    model: gemini-3.8-flash
    effort: high
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    timeouts:
      wallMs: 14400000 # 4 h: fix turns run suites too

harnesses:
  agy:
    acpx:
      agent: agy acp
      raw: true
      args: [--approve-all]
      effort:
        configId: thought_level
        levels: [low, medium, high]
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }

scouts:
  model: openrouter/baidu/ernie-5.5-flash-preview:free
  effort: high

# USD per million tokens. A model absent here is unpriced (unknown), never $0;
# agy reports no cost: gemini-3.8-flash stays unpriced until real rates exist.
# Go legs priced from the existing rows; ernie :free billed at 0.
prices:
  anthropic/claude-opus-5-5: { input: 4, cachedInput: 0.2, output: 20, reasoning: 20 }
  anthropic/claude-sonnet-5-5: { input: 2, cachedInput: 0.1, output: 10, reasoning: 10 }
  opencode/beam-free: { input: 0, cachedInput: 0, output: 0, reasoning: 0 }
  opencode-go/muse-spark-1.3-contributor: { input: 0.15, cachedInput: 0.003, output: 0.6, reasoning: 0.6 }
  opencode-go/deepseek-v4.1-flash: { input: 0.15, cachedInput: 0.003, output: 0.6, reasoning: 0.6 }
  openrouter/baidu/ernie-5.5-flash-preview:free: { input: 0, cachedInput: 0, output: 0, reasoning: 0 }

limits:
  concurrency: 3
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
