# Self-run, full-harness rotation (iteration 33 forward, owner 2026-11-16):
# every harness in an applicable role — architect claude-code, implementer pi,
# reviewer codex, PM + escalation omp, digest opencode (agy binding kept; agy
# spent all i32 reviews and returns in a later rotation).
# Every alias carries >=1 fallback. i32 built cross-harness + effort-bearing
# fallbacks in-tree, so the owner's pi→opencode target ships as implementer fb2,
# and the new claude architect gets the proven omp/opus chain as fb2.
# All six legs probed live 2026-11-16 before this config shipped (beam + Go via
# opencode CLI; pi/codex/claude incl. --model routing via acpx; agy spent i32).
# Reviewer is task-grade (INTENT): codex/deepseek reviews its pi/deepseek sibling
# in a different context and focus. i32 was muse-implements; i33 deepseek-
# implements continues the unsettled muse-vs-deepseek comparison.
aliases:
  architect:
    harness: claude-code
    model: opus
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: single turns must not die on the 1 h default
    fallbacks:
      - model: sonnet
        effort: high
      - harness: omp
        model: anthropic/claude-opus-5-5
        effort: high
  pm:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    escalateTo: escalation
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        effort: max
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
  digest:
    harness: opencode
    model: opencode/beam-free
    effort: max
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        effort: max
  implementer:
    harness: pi
    model: opencode-go/deepseek-v4.1-flash
    effort: xhigh
    timeouts:
      wallMs: 14400000 # 4 h: suite-heavy turns (20x reruns) exceed 1 h
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: xhigh
      - harness: opencode
        model: opencode-go/deepseek-v4.1-flash
        effort: max
  reviewer:
    harness: codex
    model: deepseek-v4.1-flash
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - model: muse-spark-1.3-contributor
        effort: high
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    timeouts:
      wallMs: 14400000 # 4 h: fix turns run suites too
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
  steward:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    fallbacks:
      - harness: pi
        model: opencode-go/deepseek-v4.1-flash
        effort: high

harnesses:
  agy:
    acpx:
      agent: agy acp
      raw: true
      args: [--approve-all]
      effort:
        configId: thought_level
        levels: [low, medium, high]
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
  pi:
    acpx:
      agent: pi
      effort: { configId: thought_level, levels: [off, minimal, low, medium, high, xhigh] }
      usage: { cache: false }
  codex:
    acpx:
      agent: codex
      effort: { configId: reasoning_effort, levels: [low, medium, high, xhigh, max] }
      usage: { cache: true }
  claude-code:
    acpx:
      agent: claude
      effort: { configId: effort, levels: [low, medium, high, xhigh, max] }
  # The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
  # data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
  opencode:
    acpx:
      agent: opencode acp
      raw: true
      effort: { configId: effort, levels: [low, medium, high, xhigh, max] }
      usage: { cache: true }

scouts:
  model: openrouter/baidu/ernie-5.5-flash-preview:free
  effort: high

# Harness model id -> OpenRouter model id, only where matching cannot resolve.
# Prices come from OpenRouter's model list; opencode is the only acpx harness
# that reports a cost, so pi/codex/claude/agy ids stay unpriced (unknown, never
# $0) until real rates exist (agy precedent, i32). Beam has no beam-suffixed
# OpenRouter id, hence the explicit map (self-acpx.yaml precedent).
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency: { overall: 3 }
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
