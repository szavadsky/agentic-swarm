# Self-run, dead-agy fix (2026-11-19, operator writ, owner leg guidance):
# agy/Antigravity HARD DEAD (individual quota, resets ~130h) — steward +
# plan roles move off agy onto working legs (hy4 primary $0, deepseek
# fallback). Implementer primary stays agy (OWNER CALL pending to flip;
# deepseek fallback carries 100% meanwhile). Rest of map unchanged
# (implementer-b/researcher from alternates-default kept). base.yaml supplies
# the omp/opencode bindings, limits, session store and worktree root.
extends: base.yaml
aliases:
  architect:
    harness: claude-code
    model: opus
    subscription: claude
    timeouts:
      wallMs: 14400000 # 4 h: single turns must not die on the 1 h default
    fallbacks:
      - model: sonnet
        effort: high
        sharesPool: true # same Claude subscription, different model
      - harness: omp
        model: anthropic/claude-opus-5-5
        effort: high
        sharesPool: true # omp Opus bills to the same Claude subscription
  pm:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    subscription: openrouter-free
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  digest:
    harness: omp
    model: "@free"
    effort: null
    subscription: openrouter-free
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  implementer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    subscription: antigravity
    timeouts:
      wallMs: 14400000 # 4 h: suite-heavy turns (20x reruns) exceed 1 h
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
  implementer-b:
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go
  researcher:
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go
  reviewer:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  qa:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  plan-reviewer:
    harness: opencode
    model: opencode/hy4-flash-free
    effort: high
    subscription: opencode-free
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
  plan-checker:
    harness: opencode
    model: opencode/hy4-flash-free
    effort: high
    subscription: opencode-free
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
  escalation:
    effort: high
    subscription: claude
    timeouts:
      wallMs: 14400000 # 4 h: fix turns run suites too
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go # the Muse account, not the Claude pool
  steward:
    harness: opencode
    model: opencode/hy4-flash-free
    effort: high
    subscription: opencode-free
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go

harnesses:
  agy:
    compaction: { enabled: false, reason: "/compact is sent to the model as a prompt and compacts nothing" }
    acpx:
      agent: agy acp
      raw: true
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
    options: { args: [--approve-all] }
  pi:
    compaction: { enabled: true }
    acpx:
      agent: pi
      compact: true
      effort: { configId: thought_level }
      usage: { cache: true, command: "/session" }
  codex:
    compaction: { enabled: true }
    acpx:
      agent: codex
      compact: true
      effort: { configId: reasoning_effort }
      usage: { cache: true }
  # `/compact` is an adapter command here: the record carries a `Compact
  # conversation` tool call, 16512 -> 3492 tokens at $0.00 reported
  # (compaction-probe.md §1).
  claude-code:
    compaction: { enabled: true }
    acpx:
      agent: claude
      compact: true
      effort: { configId: effort }
    options: { args: [--approve-all] }

scouts:
  model: openrouter/baidu/ernie-5.5-flash-preview:free
  effort: high
# Harness model id -> OpenRouter model id, only where matching cannot resolve.
# @free maps to its primary's $0 row (ernie-free); omp-internal Go hops are
# invisible to pricing — limitation journaled, steered as observation.
priceIds:
  "@free": baidu/ernie-5.5-flash-preview:free
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opencode/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opencode-go/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency: { overall: 3, perSubscription: { opencode-go: 2, openrouter-free: 1, claude: 1, antigravity: 2, opencode-free: 1 } }
