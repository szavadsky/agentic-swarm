# Self-run, emergency rotation (iteration 39 forward, owner 2026-11-16):
# OpenCode Go MONTHLY quota exhausted (resets in ~14d, confirmed live) — every
# Go model on every harness 429s. pi (Go-only provider) and codex (Go-only
# auth) sit out with evidence; all roles reroute to omp / agy / opencode-free.
# Implementer goes to agy/gemini (strongest live task model; the paid
# subscription must be used); omp/ernie-free covers reviewer/
# escalation-fallback/steward (small-reviewing-large is explicitly allowed).
# muse-vs-deepseek comparison PAUSED (both Go). Revert to B-shape when Go
# resets. Every alias keeps >=1 fallback; no Go id anywhere below.
aliases:
  architect:
    harness: omp
    model: anthropic/claude-opus-5-5
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: single turns must not die on the 1 h default
    fallbacks:
      - harness: claude-code
        model: opus
        effort: high
      - harness: claude-code
        model: sonnet
        effort: high
  pm:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    escalateTo: escalation
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  digest:
    harness: opencode
    model: opencode/beam-free
    effort: high
    fallbacks:
      - model: opencode/hy4-flash-free
        effort: high
  implementer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: suite-heavy turns (20x reruns) exceed 1 h
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  reviewer:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: agy
        model: gemini-3.8-flash
        effort: high
  plan-reviewer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  plan-checker:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    timeouts:
      wallMs: 14400000 # 4 h: fix turns run suites too
    fallbacks:
      - model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  steward:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    fallbacks:
      - harness: agy
        model: gemini-3.8-flash
        effort: high

harnesses:
  agy:
    acpx:
      agent: agy acp
      raw: true
      args: [--approve-all]
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
  pi:
    acpx:
      agent: pi
      compact: true
      effort: { configId: thought_level }
      usage: { cache: true, command: "/session" }
  codex:
    acpx:
      agent: codex
      compact: true
      effort: { configId: reasoning_effort }
      usage: { cache: true }
  claude-code:
    acpx:
      agent: claude
      args: [--approve-all]
      effort: { configId: effort }
  # The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
  # data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
  # Live effort options are none/high/default (`set effort max` rejected,
  # probed 2026-11-16) — high is this harness's real max.
  opencode:
    acpx:
      agent: opencode acp
      compact: true
      raw: true
      effort: { configId: effort }
      usage: { cache: true }

scouts:
  model: openrouter/baidu/ernie-5.5-flash-preview:free
  effort: high

# Harness model id -> OpenRouter model id, only where matching cannot resolve.
# Go ids unused while the quota is exhausted (kept for the revert). hy4-free
# maps to the $0 beam row (free model, no hy4-suffixed id — beam precedent).
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opencode/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency: { overall: 3 }
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
