# Self-run, full rotation (iteration 42 forward, owner 2026-11-16/17):
# A-shape continues (claude-code architect VERIFIED clean i41). Mechanical
# digest on literal `@free` (preflight-omp-alias unblocked it; no effort key —
# baked into the role; omp validates). QA/reviewer/PM open the ernie↔hy4
# rotation ernie-first (hy4 has 0 production turns; any ernie failure tests it
# via fallback); i43 flips. Task-grade flips Go legs (deepseek implements,
# muse reviews). Subscriptions named per pool; per-pool caps on the two known
# constraints (go: 2 keys, openrouter-free: 1 after i40's ernie quota 3x).
# iterationUsd stays off per owner call (0). pi/codex/opencode-CLI Go still out
# (sub A ~13d); their legs rejoin at reset.
aliases:
  architect:
    harness: claude-code
    model: opus
    effort: high
    subscription: claude
    timeouts:
      wallMs: 14400000 # 4 h: single turns must not die on the 1 h default
    fallbacks:
      - model: sonnet
        effort: high
      - harness: omp
        model: anthropic/claude-opus-5-5
        effort: high
  pm:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    escalateTo: escalation
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  digest:
    harness: omp
    model: "@free"
    subscription: openrouter-free
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  implementer:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    subscription: opencode-go
    timeouts:
      wallMs: 14400000 # 4 h: suite-heavy turns (20x reruns) exceed 1 h
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
  reviewer:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  qa:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: opencode
        model: opencode/hy4-flash-free
        effort: high
        subscription: opencode-free
  plan-reviewer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    subscription: antigravity
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  plan-checker:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    subscription: antigravity
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    effort: high
    subscription: claude
    timeouts:
      wallMs: 14400000 # 4 h: fix turns run suites too
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        effort: max
  steward:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    fallbacks:
      - harness: agy
        model: gemini-3.8-flash
        effort: high

harnesses:
  agy:
    acpx:
      agent: agy acp
      raw: true
      args: [--approve-all]
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
  pi:
    acpx:
      agent: pi
      compact: true
      effort: { configId: thought_level }
      usage: { cache: true, command: "/session" }
  codex:
    acpx:
      agent: codex
      compact: true
      effort: { configId: reasoning_effort }
      usage: { cache: true }
  claude-code:
    acpx:
      agent: claude
      args: [--approve-all]
      effort: { configId: effort }
  # The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
  # data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
  # Live effort options are none/high/default (`set effort max` rejected,
  # probed 2026-11-16) — high is this harness's real max.
  opencode:
    acpx:
      agent: opencode acp
      compact: true
      raw: true
      effort: { configId: effort }
      usage: { cache: true }

scouts:
  model: openrouter/baidu/ernie-5.5-flash-preview:free
  effort: high

# Harness model id -> OpenRouter model id, only where matching cannot resolve.
# @free maps to its primary's $0 row (ernie-free); omp-internal Go hops are
# invisible to pricing — limitation journaled, steered as observation.
priceIds:
  "@free": baidu/ernie-5.5-flash-preview:free
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opencode/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opencode-go/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency: { overall: 3, perSubscription: { opencode-go: 2, openrouter-free: 1, claude: 1, antigravity: 2, opencode-free: 1 } }
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
