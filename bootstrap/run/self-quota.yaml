# Self-run, spendable-legs reroute (iteration 19 forward): task work on the
# owner-ordered ladder strongest->weakest — omp/muse, agy/gemini,
# omp/deepseek, omp/ernie 5.5 — beam and inkling are mechanical tiers only
# (digest, commits). Reviewer is a task-grade model (INTENT): same family
# reviews its own sibling in a different context and focus.
# Rotation 2026-11-16 (post-reboot): reviewer role on agy/gemini (0 turns so
# far per owner's Observed line; supported+live, task-grade 2nd in ladder).
# omp muse chain kept as reviewer-omp switchback.
aliases:
  architect:
    harness: omp
    model: anthropic/claude-opus-5-5
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: single turns must not die on the 1 h default
  pm:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    escalateTo: escalation
    fallbacks:
      - opencode-go/deepseek-v4.1-flash
      - opencode-go/muse-spark-1.3-contributor
  digest:
    harness: opencode
    model: opencode/beam-free
    effort: max
  implementer:
    harness: omp
    model: opencode-go/muse-spark-1.3-contributor
    effort: max
    timeouts:
      wallMs: 14400000 # 4 h: suite-heavy turns (20x reruns) exceed 1 h
    fallbacks:
      - opencode-go/deepseek-v4.1-flash
      - openrouter/baidu/ernie-5.5-flash-preview:free
  reviewer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
  reviewer-omp:
    harness: omp
    model: opencode-go/muse-spark-1.3-contributor
    effort: max
    timeouts:
      wallMs: 14400000 # 4 h: same rule as implementer
    fallbacks:
      - opencode-go/deepseek-v4.1-flash
      - openrouter/baidu/ernie-5.5-flash-preview:free
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5
    timeouts:
      wallMs: 14400000 # 4 h: fix turns run suites too

harnesses:
  agy:
    acpx:
      agent: agy acp
      raw: true
      args: [--approve-all]
      effort:
        configId: thought_level
        levels: [low, medium, high]
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }

scouts:
  model: openrouter/baidu/ernie-5.5-flash-preview:free
  effort: high

# Prices come from the harness or OpenRouter's model list (cached locally);
# nothing is hardcoded here. agy reports no cost, so gemini matches OpenRouter
# by suffix; ernie matches once the openrouter/ provider prefix is stripped.
# Only beam, with no beam-suffixed OpenRouter id, is mapped explicitly to the
# only beam-family entry.
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b

limits:
  concurrency: 3
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
