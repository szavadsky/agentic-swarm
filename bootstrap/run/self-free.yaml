# Self-run on the pools that are live at 2026-11-22T08:40Z:
# - Claude OK: architect (Opus), escalation (Sonnet).
# - Antigravity OK: gemini-3.8-flash.
# - OpenCode Go OK: deepseek-v4.1-flash, muse-spark-1.3-contributor,
#   hy4-flash-free.
# - openrouter-free (ernie) exhausted until 2026-11-23T00:00Z: not used.
# - opencode-free exhausted until 2026-11-22T13:39Z: not used.
# - ember is NOT free; not used.
# Steps of one flow sit on different models (implementer / qa / reviewer).
extends: base.yaml
aliases:
  architect:
    harness: claude-code
    model: opus
    subscription: claude
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: sonnet
        effort: high
        sharesPool: true
  escalation:
    harness: claude-code
    model: sonnet
    effort: high
    subscription: claude
    timeouts:
      wallMs: 14400000
    fallbacks:
      - harness: agy
        model: gemini-3.8-flash
        effort: high
        subscription: antigravity
  implementer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    subscription: antigravity
    timeouts:
      wallMs: 14400000
    fallbacks:
      - harness: opencode
        model: opencode-go/deepseek-v4.1-flash
        effort: high
        subscription: opencode-go
      - harness: opencode
        model: opencode-go/muse-spark-1.3-contributor
        effort: high
        subscription: opencode-go
  implementer-b:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    effort: high
    subscription: opencode-go
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        subscription: opencode-go
      - harness: agy
        model: gemini-3.8-flash
        effort: high
        subscription: antigravity
  researcher:
    harness: opencode
    model: opencode-go/muse-spark-1.3-contributor
    effort: high
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        subscription: opencode-go
      - harness: agy
        model: gemini-3.8-flash
        effort: high
        subscription: antigravity
  qa:
    harness: opencode
    model: opencode-go/hy4-flash-free
    effort: high
    subscription: opencode-go
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        subscription: opencode-go
      - harness: agy
        model: gemini-3.8-flash
        effort: high
        subscription: antigravity
  reviewer:
    harness: opencode
    model: opencode-go/muse-spark-1.3-contributor
    effort: high
    subscription: opencode-go
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        subscription: opencode-go
  plan-reviewer:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    effort: high
    subscription: opencode-go
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        subscription: opencode-go
  plan-checker:
    harness: opencode
    model: opencode-go/hy4-flash-free
    effort: high
    subscription: opencode-go
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        subscription: opencode-go
  pm:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    effort: high
    subscription: opencode-go
    escalateTo: escalation
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        subscription: opencode-go
      - harness: claude-code
        model: sonnet
        effort: high
        subscription: claude
  pack-preparer:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    effort: high
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/hy4-flash-free
        subscription: opencode-go
  digest:
    harness: opencode
    model: opencode-go/hy4-flash-free
    effort: high
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        subscription: opencode-go
  intent:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    effort: high
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/hy4-flash-free
        subscription: opencode-go
  steward:
    harness: opencode
    model: opencode-go/hy4-flash-free
    effort: high
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        subscription: opencode-go

harnesses:
  # No `compact`: agy submits `/compact` to the model as a prompt and compacts nothing.
  agy:
    acpx:
      agent: agy acp
      raw: true
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
    options: { args: [--approve-all] }
  claude-code:
    acpx:
      agent: claude
      compact: true
      effort: { configId: effort }
    options: { args: [--approve-all] }

scouts: null
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opencode/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opencode-go/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency:
    overall: 3
    perSubscription: { claude: 1, antigravity: 2, opencode-go: 2 }
