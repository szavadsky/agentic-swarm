# Self-run on current availability (owner, 2026-11-21):
# - Claude subscription OK: architect (Opus), escalation (Sonnet).
# - Antigravity (agy, gemini flash) available.
# - OpenCode Go subscriptions: deepseek-v4.1-flash, muse-spark-1.3-contributor,
#   hy4-flash-free.
# - OpenCode harness: only free flash models (deepseek/minimax/beam/hy4).
# - OpenRouter ernie free: omp only. hy4 free: omp and opencode.
# - ember is NOT free; not used.
# Steps of one flow sit on different models (implementer / QA / reviewer).
extends: base.yaml
aliases:
  architect:
    harness: claude-code
    model: opus
    subscription: claude
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: sonnet
        effort: high
        sharesPool: true
  escalation:
    harness: claude-code
    model: sonnet
    effort: high
    subscription: claude
    timeouts:
      wallMs: 14400000
    fallbacks:
      - harness: agy
        model: gemini-3.8-flash
        effort: high
        subscription: antigravity
  implementer:
    harness: agy
    model: gemini-3.8-flash
    effort: high
    subscription: antigravity
    timeouts:
      wallMs: 14400000
    fallbacks:
      - harness: opencode
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
      - harness: opencode
        model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go
  implementer-b:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    subscription: opencode-go
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
        subscription: opencode-go
      - harness: agy
        model: gemini-3.8-flash
        effort: high
        subscription: antigravity
  researcher:
    harness: opencode
    model: opencode-go/muse-spark-1.3-contributor
    effort: max
    subscription: opencode-go
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
  qa:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    timeouts:
      wallMs: 14400000
    fallbacks:
      - harness: omp
        model: opencode-go/hy4-flash-free
        effort: high
        subscription: opencode-go
  reviewer:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    subscription: opencode-free
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: opencode/deepseek-v4.1-flash-free
        subscription: opencode-free
  plan-reviewer:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    subscription: opencode-free
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: opencode/deepseek-v4.1-flash-free
        subscription: opencode-free
  plan-checker:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    effort: high
    subscription: opencode-free
    timeouts:
      wallMs: 14400000
    fallbacks:
      - harness: omp
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        effort: high
        subscription: openrouter-free
  pm:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    effort: high
    subscription: openrouter-free
    escalateTo: escalation
    fallbacks:
      - harness: opencode
        model: opencode/deepseek-v4.1-flash-free
        effort: high
        subscription: opencode-free
  pack-preparer:
    harness: omp
    model: opencode-go/hy4-flash-free
    effort: high
    subscription: opencode-go
    fallbacks:
      - harness: opencode
        model: opencode/deepseek-v4.1-flash-free
        subscription: opencode-free
  digest:
    harness: omp
    model: openrouter/baidu/ernie-5.5-flash-preview:free
    subscription: openrouter-free
    fallbacks:
      - harness: opencode
        model: opencode/beam-free
        subscription: opencode-free
  intent:
    harness: opencode
    model: opencode/beam-free
    fallbacks:
      - model: opencode/deepseek-v4.1-flash-free
        subscription: opencode-free
  steward:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    subscription: opencode-free
    fallbacks:
      - harness: agy
        model: gemini-3.8-flash
        effort: high
        subscription: antigravity

harnesses:
  # No `compact`: agy submits `/compact` to the model as a prompt and compacts nothing.
  agy:
    acpx:
      agent: agy acp
      raw: true
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
    options: { args: [--approve-all] }
  claude-code:
    acpx:
      agent: claude
      compact: true
      effort: { configId: effort }
    options: { args: [--approve-all] }

scouts:
  model: opencode-go/deepseek-v4.1-flash
  effort: high
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
  opencode/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opencode-go/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency:
    overall: 3
    perSubscription: { claude: 1, antigravity: 2, opencode-go: 2, opencode-free: 2, openrouter-free: 1 }
