# Shakedown while the free tier is exhausted: primaries on the opencode-go
# subsidy (deepseek-v4.1), mechanical turns on beam-free. No alibaba except
# qwen-max (D16). base.yaml carries the omp and opencode bindings, limits and
# roots; this overlay moves the roles and the beam price row.
extends: base.yaml
aliases:
  architect:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
  pm:
    model: opencode-go/beam-free
    effort: null
    escalateTo: null
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  digest:
    model: opencode-go/beam-free
    effort: null
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  implementer:
    model: opencode-go/deepseek-v4.1-flash
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
  # The implementer primary is already the Go deepseek model; the retry
  # alternate is the subscription's other allowed model.
  implementer-b:
    model: opencode-go/muse-spark-1.3-contributor
    fallbacks: null
  researcher:
    harness: opencode
    effort: null
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
  reviewer:
    model: opencode-go/deepseek-v4.1-flash
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
  plan-reviewer:
    model: opencode-go/deepseek-v4.1-flash
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
  steward:
    model: opencode-go/deepseek-v4.1-flash
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
  plan-checker:
    model: opencode-go/deepseek-v4.1-flash
    fallbacks:
      - model: opencode-go/muse-spark-1.3-contributor
  escalation: null
priceIds:
  opencode/beam-free: null
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
scouts: null
