# Zero-cost shakedown: every role through opencode, fallbacks through paid plans.
aliases:
  architect:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    effort: high
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  pm:
    harness: opencode
    model: opencode/beam-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  digest:
    harness: opencode
    model: opencode/beam-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  implementer:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  reviewer:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  steward:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  plan-checker:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash

# The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
# data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
harnesses:
  opencode:
    acpx:
      agent: opencode acp
      raw: true
      effort: { configId: effort, levels: [low, medium, high, xhigh, max] }
      usage: { cache: true }

# Prices come from the harness or OpenRouter's model list; beam has no
# beam-suffixed OpenRouter id and is mapped explicitly to the only
# beam-family entry.
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b

limits:
  concurrency: { overall: 3 }
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
