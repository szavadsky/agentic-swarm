# Zero-cost shakedown: every role through opencode, fallbacks through paid
# plans. base.yaml's omp binding, escalation alias and scout pin are unused
# here and removed.
extends: base.yaml
aliases:
  architect:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  pm:
    model: opencode/beam-free
    effort: null
    escalateTo: null
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  digest:
    model: opencode/beam-free
    effort: null
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  # The retry alternate is a different free model, so this shakedown keeps
  # every role on opencode and at zero cost.
  implementer-b:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    effort: null
    fallbacks: null
  researcher:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    effort: null
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  escalation: null
harnesses:
  omp: null
scouts: null
