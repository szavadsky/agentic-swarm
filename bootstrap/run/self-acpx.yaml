# Self-run through acpx: implementer on pi, reviewer on codex, one each.
# They share a task worktree, so each turn gets its own named acpx session.
aliases:
  architect:
    harness: omp
    model: anthropic/claude-opus-5-5
    effort: high
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  pm:
    harness: opencode
    model: opencode/beam-free
    effort: max
    escalateTo: escalation
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  digest:
    harness: opencode
    model: opencode/beam-free
    effort: max
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  implementer:
    harness: pi
    model: opencode-go/beam-free
    effort: max
  researcher:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    fallbacks:
      - harness: opencode
        model: opencode/deepseek-v4.1-flash-free
  steward:
    harness: pi
    model: opencode-go/beam-free
    effort: max
  plan-checker:
    harness: pi
    model: opencode-go/beam-free
    effort: max
  # Reviewer on agy first, codex kept switchable (iteration 17 agy-acpx-leg forward).
  # Cross-harness fallback needs the kernel change from that task's architect concern.
  reviewer:
    harness: agy
    model: gemini-3.8-flash-high
    # no effort key: the suffix is the effort
  plan-reviewer:
    harness: agy
    model: gemini-3.8-flash-high
    # no effort key: the suffix is the effort
  reviewer-codex:
    harness: codex
    model: deepseek-v4.1-flash
    effort: high
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5

# acpx harness bindings: each id is a config name, no code. Effort is a session
# config option; agy also splits it out of the model id, and needs approve-all
# or every shell command is denied (probe §7).
harnesses:
  # The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
  # data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
  opencode:
    acpx:
      agent: opencode acp
      compact: true
      raw: true
      effort: { configId: effort }
      usage: { cache: true }
  pi:
    acpx:
      agent: pi
      compact: true
      effort: { configId: thought_level }
      usage: { cache: true, command: "/session" }
  codex:
    acpx:
      agent: codex
      compact: true
      effort: { configId: reasoning_effort }
      usage: { cache: true }
  agy:
    acpx:
      agent: agy acp
      raw: true
      args: [--approve-all]
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }

scouts:
  model: opencode-go/deepseek-v4.1-flash

# Prices come from the harness or OpenRouter's model list (cached locally);
# nothing is hardcoded here. Codex reports tokens without cost, so its bare
# model id matches OpenRouter by suffix; agy reports no cost and its
# effort-suffixed id matches once the suffix is stripped. Only beam, with no
# beam-suffixed OpenRouter id, is mapped explicitly to the only beam-family
# entry.
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b

limits:
  concurrency: { overall: 3 }
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
