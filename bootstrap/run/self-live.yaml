        subscription: opencode-go
      - harness: opencode
        model: opencode/mimo-v2.6-flash-free
        effort: max
        subscription: opencode-free
      - harness: agy
        model: gemini-3.8-flash
        effort: high
        subscription: antigravity
  qa:
    harness: opencode
    model: opencode/mimo-v2.6-flash-free
    effort: max
    subscription: opencode-free
    timeouts:
      wallMs: 14400000
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
      - harness: cmdc
        model: meta/muse-ember
        effort: max
