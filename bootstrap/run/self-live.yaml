    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: opencode-go/hy4-flash-free
        effort: xhigh
        subscription: opencode-go-free
      - model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go

harnesses:
  # No `compact`: agy submits `/compact` to the model as a prompt and compacts nothing.
  agy:
    acpx:
      agent: agy acp
      raw: true
      effort:
        configId: thought_level
        modelBases: { gemini-3.8-flash: [low, medium, high] }
      usage: { cache: true }
    options: { args: [--approve-all] }
  claude-code:
    acpx:
      agent: claude
      compact: true
      effort: { configId: effort }
    options: { args: [--approve-all] }
  # Command Code over ACP; `effort` is a session config option (low..max).
  # No `compact`: not probed yet.
  cmdc:
    acpx:
      agent: cmdc acp
      raw: true
      effort: { configId: effort }
      usage: { cache: true }
    options: { args: [--approve-all] }

scouts:
  model: opencode-go/deepseek-v4.1-flash
  effort: max
priceIds:
  opencode-go/hy4-flash-free: reflection/beam-1.0-501b-a23b
  opus: anthropic/claude-opus-5-5
  sonnet: anthropic/claude-sonnet-5-5

limits:
  concurrency:
    overall: 3
    perSubscription:
      claude: 1
      opencode-go: 2
      opencode-go-free: 1
      opencode-free: 1
      command-code: 2
      openrouter-free: 1
      antigravity: 1
