    model: sonnet
    effort: high
    subscription: claude
    timeouts:
      wallMs: 14400000
    fallbacks:
      - harness: omp
        model: opencode-go/muse-spark-1.3-contributor
        effort: max
        subscription: opencode-go
  implementer:
    harness: cmdc
    model: meta/muse-ember
    effort: max
    subscription: command-code
    timeouts:
      wallMs: 14400000
    fallbacks:
      - harness: omp
        model: opencode-go/deepseek-v4.1-flash
        effort: max
        subscription: opencode-go
      - harness: opencode
        model: opencode/deepseek-v4.1-flash-free
        effort: max
        subscription: opencode-free
      - harness: agy
        model: gemini-3.8-flash
        effort: high
        subscription: antigravity
  implementer-b:
