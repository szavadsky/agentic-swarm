# Self-run on the legs that work at 2026-11-22 (owner report):
# - NOT working for a few days: pi, codex, and the OpenCode Go key in the
#   opencode harness. Not used here.
# - Working: the OpenCode Go key in omp (deepseek-v4.1-flash,
#   muse-spark-1.3-contributor), OpenCode Go free tier hy4-flash-free,
#   opencode-harness free models (deepseek-v4.1-flash-free, mimo-v2.6-flash-free),
#   Command Code (muse-ember, `cmdc acp` through acpx; PoC 2026-11-22 OK),
#   OpenRouter free ernie 5.5 (omp), agy, Claude.
# Task level: opencode free deepseek/mimo; Command Code muse-ember; omp Go
#   muse-spark / deepseek (omp Go deepseek is in every fallback chain); agy.
# Free level (digest, intent, pack-preparer, plan-checker): hy4, ernie; all fall
#   back to omp Go deepseek.
# Architect: Claude only. Escalation: Sonnet. Claude is in no task-level chain.
# hy4 has its own pool (opencode-go-free) so a Go quota answer does not latch it.
# Steps of one flow sit on different models (implementer / qa / reviewer).
extends: base.yaml
aliases:
  architect:
    harness: claude-code
    model: opus
    effort: xhigh
    subscription: claude
    timeouts:
      wallMs: 14400000
    fallbacks:
      - model: sonnet
        effort: high
        sharesPool: true
  escalation:
