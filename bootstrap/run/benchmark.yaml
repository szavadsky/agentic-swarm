# Fixed benchmark (bootstrap/context/benchmark.md §3-4): the cheap tier of the
# base config. base.yaml's paid architect (Opus through omp) is pinned to the
# subsidized deepseek tier with no fallback, so a flaky architect parks the step
# instead of silently changing the model under comparison; the free
# implementer/reviewer aliases and their fallbacks are the base's. One
# iteration per launch; the goal is reset before every launch. Runtime dirs are
# relative to the target repo, which reset.sh keeps at <dest>/target, so both
# land under <dest> and outside the repository.
extends: base.yaml
aliases:
  architect:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    fallbacks: null
  pm:
    model: opencode/beam-free
    effort: null
    escalateTo: null
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  digest:
    effort: null
  # The retry alternate leaves the free tier: one paid Go turn, at the same
  # effort the self run uses, instead of repeating the model that failed, and
  # no fallback so the benchmark stays on the pinned model.
  implementer-b:
    fallbacks: null
  researcher:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    effort: null
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  # The base's escalation alias belongs to the PM ladder the benchmark turns off.
  escalation: null

# Prices come from the harness or OpenRouter's model list (cached locally);
# nothing is hardcoded here. Only beam, with no beam-suffixed OpenRouter id, is
# mapped explicitly to the only beam-family entry.
priceIds:
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b

sessions:
  dir: ../runtime/sessions
  retention: short

worktreeRoot: ../runtime/worktrees

# The architect subagent pin is a self-run concern; the benchmark runs none.
scouts: null
