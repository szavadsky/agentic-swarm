# Fixed benchmark (bootstrap/context/benchmark.md §3-4): the cheap tier of self.yaml.
# self.yaml's paid architect (Opus through omp) is pinned to the subsidized
# deepseek tier with no fallback, so a flaky architect parks the step instead of
# silently changing the model under comparison; the free implementer/reviewer/PM
# aliases and their fallbacks are unchanged. One iteration per launch; the goal
# is reset before every launch. Runtime dirs are relative to the target repo,
# which reset.sh keeps at <dest>/target, so both land under <dest> and outside
# the repository.
aliases:
  architect:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    effort: high
  pm:
    harness: opencode
    model: opencode/beam-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  digest:
    harness: opencode
    model: opencode/beam-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  implementer:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  # The retry alternate leaves the free tier: one paid Go turn, at the same
  # effort the self run uses, instead of repeating the model that failed.
  implementer-b:
    harness: omp
    model: opencode-go/deepseek-v4.1-flash
    effort: max
  researcher:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  reviewer:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  plan-reviewer:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  steward:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  plan-checker:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash

# The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
# data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
harnesses:
  # omp is native; the unattended policy is opaque overlay keys here, not code.
  omp:
    options:
      defaultThinkingLevel: low
      memory: { backend: off }
      autolearn: { enabled: false }
      skills: { enabled: false }
      features: { unexpectedStopDetection: false }
      tools: { approvalMode: yolo, xdev: false }
      compaction: { experimentalContextManagement: false }
      disabledProviders: [native, claude, codex, gemini, opencode, cursor, agents-md]
      retry: { enabled: false, modelFallback: false }
  opencode:
    acpx:
      agent: opencode acp
      compact: true
      raw: true
      effort: { configId: effort }
      usage: { cache: true }

# Prices come from the harness or OpenRouter's model list (cached locally);
# nothing is hardcoded here. Every model above matches by normalized id except
# beam, which has no beam-suffixed OpenRouter id and is mapped explicitly to
# the only beam-family entry.
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b

limits:
  concurrency: { overall: 3 }
  iterations: 1

sessions:
  dir: ../runtime/sessions
  keepRuns: 5

worktreeRoot: ../runtime/worktrees
