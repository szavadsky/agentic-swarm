# Self-run with the implementer rotating across opencode, pi and codex.
# This is `self.yaml` with one change: the implementer carries `rotate`, so
# iteration N resolves entry N % 3. Every model below is one the acpx probes
# ran (self-acpx.yaml): opencode/beam-free:max, pi opencode-go/beam-free:max,
# codex deepseek-v4.1-flash:high. A fallback without a harness runs on the
# rotated entry, so the implementer's fallback names opencode explicitly.
aliases:
  architect:
    harness: omp
    model: anthropic/claude-opus-5-5
    effort: high
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  pm:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    effort: high
    escalateTo: escalation
    fallbacks:
      - model: opencode/deepseek-v4.1-flash-free
  digest:
    harness: opencode
    model: opencode/beam-free
    effort: max
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  implementer:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    rotate:
      - harness: opencode
        model: opencode/beam-free
        effort: max
      - harness: pi
        model: opencode-go/beam-free
        effort: max
      - harness: codex
        model: deepseek-v4.1-flash
        effort: high
    fallbacks:
      - harness: opencode
        model: opencode-go/deepseek-v4.1-flash
  reviewer:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  plan-reviewer:
    harness: opencode
    model: opencode/minimax-m3.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  steward:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  plan-checker:
    harness: opencode
    model: opencode/deepseek-v4.1-flash-free
    fallbacks:
      - model: opencode-go/deepseek-v4.1-flash
  escalation:
    harness: omp
    model: anthropic/claude-sonnet-5-5

# The built-in `acpx opencode` route resolves 1.19.5 and fails on the 2.2.7
# data dir; the raw `opencode acp` route runs the installed CLI (probe §0).
# pi and codex keep the acpx bindings the probes ran.
harnesses:
  opencode:
    acpx:
      agent: opencode acp
      compact: true
      raw: true
      effort: { configId: effort }
      usage: { cache: true }
  pi:
    acpx:
      agent: pi
      compact: true
      effort: { configId: thought_level }
      usage: { cache: true, command: "/session" }
  codex:
    acpx:
      agent: codex
      compact: true
      effort: { configId: reasoning_effort }
      usage: { cache: true }

scouts:
  model: opencode-go/deepseek-v4.1-flash
# Prices come from the harness or OpenRouter's model list (cached locally);
# nothing is hardcoded here. Every model above matches by normalized id except
# beam, which has no beam-suffixed OpenRouter id and is mapped explicitly to
# the only beam-family entry (free-tier turns stay a known $0 actual with the
# paid equivalent as their list price).
priceIds:
  opencode/beam-free: reflection/beam-1.0-501b-a23b
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b

limits:
  concurrency: { overall: 3 }
  iterations: 1

sessions:
  dir: ~/.local/share/factory/sessions
  keepRuns: 5

worktreeRoot: ~/.local/share/factory/worktrees
