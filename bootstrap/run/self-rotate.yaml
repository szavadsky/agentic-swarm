# Self-run with the implementer rotating across opencode, pi and codex.
# base.yaml with one changed alias: the implementer carries `rotate`, so
# iteration N resolves entry N % 3. Every model below is one the acpx probes
# ran (self-acpx.yaml): opencode/beam-free:max, pi opencode-go/beam-free:max,
# codex deepseek-v4.1-flash:high. A fallback without a harness runs on the
# rotated entry, so the implementer's fallback names opencode explicitly; the
# rotation's own harnesses are bound here, as pre-flight validates each entry.
extends: base.yaml
aliases:
  implementer:
    rotate:
      - harness: opencode
        model: opencode/beam-free
        effort: max
      - harness: pi
        model: opencode-go/beam-free
        effort: max
      - harness: codex
        model: deepseek-v4.1-flash
        effort: high
    fallbacks:
      - harness: opencode
        model: opencode-go/deepseek-v4.1-flash
harnesses:
  pi:
    acpx:
      agent: pi
      compact: true
      effort: { configId: thought_level }
      usage: { cache: true, command: "/session" }
  codex:
    acpx:
      agent: codex
      compact: true
      effort: { configId: reasoning_effort }
      usage: { cache: true }
priceIds:
  opencode-go/beam-free: reflection/beam-1.0-501b-a23b
